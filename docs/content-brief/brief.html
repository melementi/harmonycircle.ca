ou a registered charity with the Canada Revenue Agency?","help":"Answer from your CRA paperwork, not from memory. If an application is in progress the answer is still no until the registration is granted. If the answer is no, the site will say nothing anywhere about tax receipts or tax deductions — that is not a limitation we can design around, it is the law.","kind":"choice","max":0,"req":true,"legal":true,"token":"{{IS_REGISTERED_CHARITY}}","ph":"","choices":["Yes, registered","No","Application in progress","Not sure — need to check"]},{"id":"cra-number","label":"CRA registration or business number","help":"Copy it character for character from your CRA notice of registration. Leave this empty if you are not registered. We will never fill this in, and we will never format a number that looks plausible.","kind":"short","max":24,"req":false,"legal":true,"token":"{{CRA_REGISTRATION_NUMBER}}","ph":""},{"id":"receipt-status","label":"Do donations come with a tax receipt?","help":"Only a registered charity can issue an official donation receipt. If you are not registered, answer no and the page will describe gifts plainly, without any mention of receipts.","kind":"choice","max":0,"req":true,"legal":true,"token":"{{DONATION_TAX_RECEIPTABLE}}","ph":"","choices":["Yes, for every eligible gift","Yes, above a minimum amount","No","Not sure — need to check"]},{"id":"receipt-minimum","label":"Smallest gift that gets a receipt","help":"Only if receipts start at a threshold. An amount in Canadian dollars. Leave empty if there is no minimum, or if you do not issue receipts.","kind":"short","max":16,"req":false,"legal":true,"token":"{{RECEIPT_MINIMUM}}","ph":""},{"id":"receipt-process","label":"How and when receipts are issued","help":"In plain sentences: who sends the receipt, by email or by post, and roughly how long it takes. This becomes the small print under the giving form, so it has to match what actually happens.","kind":"longtext","max":420,"req":false,"legal":true,"token":"{{RECEIPT_PROCESS}}","ph":""},{"id":"charity-wording","label":"Approved wording for your status line","help":"The exact sentence you want printed about your status, word for word as your board or your accountant has approved it. It will be used unchanged. If no approved wording exists yet, leave this empty and tell us — that is a real answer.","kind":"longtext","max":240,"req":false,"legal":true,"token":"{{CHARITY_WORDING}}","ph":""},{"id":"refund-policy","label":"Refund policy","help":"Stripe requires a refund policy for card payments. A few sentences: whether a donation can be refunded, within what window, and who to contact. If you do not have one written yet, say so and we will flag it.","kind":"longtext","max":420,"req":false,"legal":true,"token":"{{REFUND_POLICY}}","ph":""}],"repeat":null,"ink":false},{"id":"why","number":"03","eyebrow":"Where it goes","purpose":"What the money actually pays for. This is the part that persuades people, and it is the part only you can write.","layout":"split","fields":[{"id":"why-eyebrow","label":"Small label above the headline","help":"Two or three words in small capitals that say what this section is. No full stop. It is a signpost, not a sentence.","kind":"eyebrow","max":24,"req":true,"legal":false,"token":"","ph":"Impact"},{"id":"why-title","label":"Headline, first line","help":"The first line of the headline. One or two words ending in a full stop. The design sets these very large, so short is not a limitation here — it is the point.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"Your gift"},{"id":"why-accent","label":"Headline, second line (terracotta)","help":"The second line, printed in terracotta underneath the first. One or two words ending in a full stop. Read the two lines together out loud: they should land as one phrase.","kind":"display-accent","max":24,"req":true,"legal":false,"token":"","ph":"at work."},{"id":"why-body","label":"What donations pay for","help":"One or two paragraphs, 40 to 90 words. Name real things — a hall rental, a term of language classes, an interpreter for a newcomer appointment. Specifics persuade; \"supporting our mission\" does not.","kind":"body","max":650,"req":true,"legal":false,"token":"","ph":"One or two paragraphs, 40 to 90 words"}],"repeat":null,"ink":false},{"id":"amounts","number":"","eyebrow":"","purpose":"Suggested amounts. Each one needs a line saying what it buys — that line is what makes a suggested amount work at all.","layout":"cards","fields":[{"id":"amount-value","label":"Amount","help":"A figure in Canadian dollars, digits only, no dollar sign. Three or four suggestions is the sweet spot, with the middle one the amount you most want people to choose.","kind":"stat-value","max":10,"req":true,"legal":false,"token":"","ph":"A figure in Canadian dollars"},{"id":"amount-label","label":"What this amount pays for","help":"One short line, six to twelve words, naming a real thing this amount covers. This is the whole reason a suggested amount outperforms an empty box.","kind":"stat-label","max":80,"req":false,"legal":true,"token":"{{PROGRAM_STATS}}","ph":""}],"repeat":{"noun":"amount","min":0,"suggested":3,"max":6},"ink":false},{"id":"other","number":"04","eyebrow":"Other ways","purpose":"Ways to give that are not a card payment — a cheque, a bank transfer, a gift in kind. Optional.","layout":"prose","fields":[{"id":"other-ways","label":"Other ways to give","help":"One paragraph. If you accept cheques or transfers, say who the cheque is made out to and where it goes. Leave empty if card is the only way.","kind":"longtext","max":520,"req":false,"legal":true,"token":"{{MAILING_ADDRESS}}","ph":""}],"repeat":null,"ink":false},{"id":"faq","number":"05","eyebrow":"Questions","purpose":"Questions donors ask. Keep the answers short and factual.","layout":"faq","fields":[{"id":"faq-question","label":"Question","help":"Phrase it the way a donor would ask it, in the first person. Under fifteen words.","kind":"short","m max":300,"req":true,"legal":false,"token":"","ph":"A line above the form."},{"id":"form-consent-text","label":"Consent wording beside the tick box","help":"The sentence next to the tick box explaining what you do with what they send: who sees it, how long you keep it, and that you will not pass it on. It has to match your privacy policy word for word — if the two disagree, the privacy policy is the one that counts legally.","kind":"longtext","max":420,"req":true,"legal":true,"token":"{{PRIVACY_POLICY}}","ph":""},{"id":"form-submit-label","label":"Button wording","help":"Two or three words, verb first.","kind":"cta-label","max":22,"req":true,"legal":false,"token":"","ph":"Two or three words, verb first"},{"id":"form-success-message","label":"Message after a message is sent","help":"One or two sentences confirming it arrived and saying what happens next. Repeat the reply window here — it is the moment people are most anxious about it.","kind":"longtext","max":300,"req":true,"legal":false,"token":"","ph":"One or two sentences"}],"repeat":null,"ink":false},{"id":"listing","number":"04","eyebrow":"Search listing","purpose":"","layout":"meta","fields":[{"id":"search-description","label":"Description shown in search results","help":"Two sentences, under 160 characters.","kind":"longtext","max":160,"req":false,"legal":false,"token":"","ph":"Two sentences, under 160 characters"}],"repeat":null,"ink":false}]},{"key":"legal","label":"Policies","route":"/privacy-policy, /accessibility","blurb":"Two required pages. Both have legal weight in Ontario and neither will be drafted for you — what goes here is text you or your lawyer have approved. If you do not have it yet, leave it empty and say so; that is a useful answer and it is what the launch checklist expects.","sections":[{"id":"privacy","number":"01","eyebrow":"Privacy","purpose":"What you do with the information people send through the forms. It has to describe what actually happens, not what sounds reassuring.","layout":"p <script id="hc-app">
/* ===========================================================================
   Harmony Circle — content brief.

   The page renders itself from two JSON islands: hc-schema (the questions,
   fixed) and hc-content (the answers, replaced on every save). Nothing is
   read back out of the live DOM, so a save is always a clean function of
   state rather than a snapshot of whatever the browser happened to be
   holding.

   Answers are kept in localStorage as you type and only written back to the
   page itself when Save is pressed, so a long afternoon of typing never
   depends on the network and never reloads the page out from under you.
   =========================================================================== */
(function () {
  "use strict";

  var SCHEMA = JSON.parse(document.getElementById("hc-schema").textContent);
  var SAVED = JSON.parse(document.getElementById("hc-content").textContent || "{}");
  var LS_KEY = "harmony-circle-brief-v1";
  var TITLE = "Harmony Circle Content Brief";
  var FONTS =
    '<link rel="preconnect" href="https://fonts.googleapis.com">' +
    '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">';

  var NAV = [
    { key: "about", label: "About" },
    { key: "programs", label: "Programs" },
    { key: "events", label: "Events" },
    { key: "getinvolved", label: "Get involved" },
    { key: "news", label: "News" },
    { key: "partners", label: "Partners" },
    { key: "contact", label: "Contact" },
  ];

  /* ---- state ------------------------------------------------------------ */
  var state = normalise(SAVED);
  var draft = null;
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) draft = normalise(JSON.parse(raw));
  } catch (e) {
    draft = null;
  }
  // The draft wins only when it is genuinely ahead of what was last saved
  // into the page, so opening a freshly saved copy never resurrects an old
  // half-finished one from this browser.
  if (draft && draft.rev > state.rev) state = draft;

  var savedRev = SAVED && SAVED.rev ? SAVED.rev : 0;
  var mode = "fill";
  var current = SCHEMA[0].key;
  var focused = null;

  function normalise(o) {
    o = o && typeof o === "object" ? o : {};
    return {
      rev: typeof o.rev === "number" ? o.rev : 0,
      seq: typeof o.seq === "number" ? o.seq : 0,
      v: o.v && typeof o.v === "object" ? o.v : {},
      r: o.r && typeof o.r === "object" ? o.r : {},
    };
  }

  function dirty() {
    return state.rev > savedRev;
  }

  function persist() {
    state.rev += 1;
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (e) {
      /* private window, full quota — the answers stay in memory and Save
         still works; there is nothing useful to tell the client here. */
    }
    refreshChrome();
  }

  /* ---- keys ------------------------------------------------------------- */
  function keyOf(page, section, field, inst) {
    return page + "." + section + (inst ? "#" + inst : "") + "." + field;
  }
  function repKey(page, section) {
    return page + "." + section;
  }
  function instances(page, section) {
    var k = repKey(page, section.id);
    if (!state.r[k]) {
      var n = Math.max(section.repeat.min, 1);
      var list = [];
      for (var i = 0; i < n; i++) list.push(newId());
      state.r[k] = list;
    }
    return state.r[k];
  }
  function newId() {
    state.seq += 1;
    return "i" + state.seq;
  }
  function get(k) {
    var val = state.v[k];
    return typeof val === "string" ? val : "";
  }
  function set(k, val) {
    if (val) state.v[k] = val;
    else delete state.v[k];
  }

  /* ---- dom helper ------------------------------------------------------- */
  function h(tag, props, kids) {
    var el = document.createElement(tag);
    if (props)
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === false || v === undefined) return;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k === "html") el.innerHTML = v;
        else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v);
      });
    (kids || []).forEach(function (kid) {
      if (kid === null || kid === undefined || kid === false) return;
      el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    });
    return el;
  }

  /* ---- the ring, from src/components/Ring.astro ------------------------- */
  var PX = { xs: 8, sm: 12, md: 16, lg: 24, xl: 40 };
  var STROKE = { xs: 1, sm: 1, md: 1.5, lg: 2, xl: 2 };
  function ring(size, variant, tone, cls) {
    var px = PX[size] || 12;
    var sw = ((STROKE[size] || 1) * 24) / px;
    var r = 12 - sw / 2;
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", px);
    svg.setAttribute("height", px);
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("focusable", "false");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute(
      "class",
      "ring ring--" + (tone || "accent") + " ring--" + variant + (cls ? " " + cls : "")
    );
    function circle(rr, fill) {
      var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", "12");
      c.setAttribute("cy", "12");
      c.setAttribute("r", rr);
      if (fill) c.setAttribute("fill", "currentColor");
      else {
        c.setAttribute("stroke", "currentColor");
        c.setAttribute("stroke-width", sw);
      }
      return c;
    }
    if (variant === "solid") svg.appendChild(circle(12, true));
    else svg.appendChild(circle(r, false));
    if (variant === "dual") svg.appendChild(circle(r * 0.4, false));
    if (variant === "dotted") svg.appendChild(circle(r * 0.32, true));
    return svg;
  }

  /* ---- field classification --------------------------------------------- */
  var HEAD_KINDS = { eyebrow: 1, "display-title": 1, "display-accent": 1, lede: 1 };
  var MULTILINE = { body: 1, longtext: 1, lede: 1 };
  var BTN_KINDS = { "cta-label": 1 };

  function fieldClass(kind, big) {
    switch (kind) {
      case "display-title":
        return (big ? "display-1" : "display-2") + " e e--display";
      case "display-accent":
        return (big ? "display-1" : "display-2") + " accent-line e e--display";
      case "display-3":
        return "display-3 e e--display";
      case "eyebrow":
        return "label e";
      case "lede":
        return "lede e";
      case "body":
      case "longtext":
        return "body-copy e";
      case "stat-value":
        return "display-3 e e--display";
      case "stat-label":
        return "label e";
      case "cta-label":
        return "e";
      default:
        return "e e--short";
    }
  }

  /* ---- one editable field ----------------------------------------------- */
  function field(f, page, section, inst, opts) {
    opts = opts || {};
    var k = keyOf(page, section.id, f.id, inst);
    var wrap = h("div", { class: "f" });

    var chip = h("span", { class: "f__chip" }, [
      ring("xs", f.legal ? "dotted" : "outline", opts.ink ? "paper" : "accent"),
      h("b", { text: f.label }),
    ]);
    if (f.legal) chip.appendChild(h("span", { class: "tagl", text: "· official wording" }));
    else if (!f.req) chip.appendChild(h("span", { class: "tagl", text: "· optional" }));
    wrap.appendChild(chip);

    var el;
    if (f.kind === "choice") {
      el = h("select", { class: "sel", id: "c-" + k });
      el.appendChild(h("option", { value: "", text: "— choose —" }));
      (f.choices || []).forEach(function (c) {
        el.appendChild(h("option", { value: c, text: c }));
      });
      el.value = get(k);
      el.addEventListener("change", function () {
        set(k, el.value);
        persist();
        paint(el, f, k);
      });
      el.addEventListener("focus", function () {
        showDock(f, k, el);
      });
    } else {
      var cls = fieldClass(f.kind, opts.big);
      el = h(MULTILINE[f.kind] ? "div" : "span", {
        class: cls,
        id: "e-" + k,
        role: "textbox",
        "aria-label": f.label,
        "data-ph": placeholder(f),
        spellcheck: "true",
      });
      if (MULTILINE[f.kind]) el.style.whiteSpace = "pre-wrap";
      el.textContent = get(k);
      el.setAttribute("contenteditable", "plaintext-only");
      if (el.contentEditable !== "plaintext-only") el.setAttribute("contenteditable", "true");

      el.addEventListener("input", function () {
        set(k, el.textContent.trim() ? el.textContent : "");
        paint(el, f, k);
        countDock(f, k);
        schedule();
      });
      el.addEventListener("paste", function (ev) {
        // Keep pasted Word and Docs copy as plain text — the site owns the
        // styling, and smuggled markup is the one thing that would break it.
        ev.preventDefault();
        var t = (ev.clipboardData || window.clipboardData).getData("text/plain") || "";
        if (!MULTILINE[f.kind]) t = t.replace(/\s+/g, " ").trim();
        document.execCommand("insertText", false, t);
      });
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" && !MULTILINE[f.kind]) {
          ev.preventDefault();
          el.blur();
        }
        if (ev.key === "Escape") el.blur();
      });
      el.addEventListener("focus", function () {
        showDock(f, k, el);
      });
      el.addEventListener("blur", function () {
        flush();
      });
    }

    paint(el, f, k);

    if (BTN_KINDS[f.kind]) {
      var btn = h("span", { class: "btn " + (opts.btn || "btn--primary") }, [
        h("span", { class: "btn__sheen", "aria-hidden": "true" }),
        el,
        ring("sm", "outline", opts.btn === "btn--outline" ? "accent" : "current"),
      ]);
      wrap.appendChild(btn);
    } else {
      wrap.appendChild(el);
    }
    return wrap;
  }

  function placeholder(f) {
    // A prompt sitting inside a pill button or a one-word eyebrow has to fit
    // that slot; the full guidance is a click away in the panel below.
    if (f.kind === "cta-label") return "Button wording";
    if (f.kind === "eyebrow") return "Section label";
    if (f.ph) return f.ph;
    if (f.legal) return "From your own records";
    return f.label;
  }

  function paint(el, f, k) {
    var empty = !get(k);
    el.classList.toggle("is-empty", empty && f.kind !== "choice");
    el.classList.toggle("is-legal", !!f.legal);
    if (f.kind === "choice") el.classList.toggle("is-empty", empty);
  }

  /* ---- the inspector ----------------------------------------------------- */
  var dock, dockLabel, dockHelp, dockShape, dockCount;

  function showDock(f, k, el) {
    focused = { f: f, k: k, el: el };
    dockLabel.textContent = "";
    dockLabel.appendChild(ring("xs", f.legal ? "dotted" : "outline", "paper"));
    dockLabel.appendChild(h("span", { text: f.label }));
    if (f.legal)
      dockLabel.appendChild(h("span", { class: "pill pill--legal", text: "Never guessed" }));
    else if (f.req) dockLabel.appendChild(h("span", { class: "pill pill--req", text: "Required" }));
    else dockLabel.appendChild(h("span", { class: "pill pill--req", text: "Optional" }));

    dockHelp.textContent = f.help;
    dockShape.textContent = "";
    if (f.legal) {
      dockShape.appendChild(
        h("b", { text: "This one is a launch blocker. " })
      );
      dockShape.appendChild(
        document.createTextNode(
          "It goes on the site exactly as you write it, and it will not be filled in for you or approximated. If you do not have the answer to hand, leave it empty rather than estimating."
        )
      );
    } else if (f.ph) {
      dockShape.appendChild(h("b", { text: "Shape: " }));
      dockShape.appendChild(document.createTextNode(f.ph));
    }
    countDock(f, k);
    dock.classList.add("is-open");
    document.documentElement.style.setProperty("--dock", dock.offsetHeight + "px");
  }

  function countDock(f, k) {
    var n = get(k).length;
    dockCount.textContent = f.max ? n + " / " + f.max : String(n);
    dockCount.classList.toggle("is-over", !!f.max && n > f.max);
  }

  function hideDock() {
    dock.classList.remove("is-open");
    document.documentElement.style.setProperty("--dock", "0px");
    focused = null;
  }

  /* ---- debounced persistence --------------------------------------------- */
  var timer = null;
  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(flush, 600);
  }
  function flush() {
    if (timer) clearTimeout(timer);
    timer = null;
    persist();
  }

  /* ---- section header ---------------------------------------------------- */
  function sectionHead(page, section, fields, big, ink, purpose) {
    var head = h("div", { class: "sechead" });
    var eyebrowField = fields.filter(function (f) {
      return f.kind === "eyebrow";
    })[0];
    var row = h("p", { class: "eyebrow label" }, [ring("xs", "dotted", ink ? "paper" : "accent")]);
    if (section.number) row.appendChild(h("span", { class: "eyebrow__num", text: "(" + section.number + ")" }));
    if (eyebrowField) {
      var ef = field(eyebrowField, page, section, null, { ink: ink });
      ef.classList.add("f--inline");
      row.appendChild(ef);
    } else if (section.eyebrow) {
      row.appendChild(h("span", { class: "eyebrow__text", text: section.eyebrow }));
    }
    head.appendChild(row);
    if (purpose) head.appendChild(h("p", { class: "purpose", text: purpose }));

    var title = fields.filter(function (f) {
      return f.kind === "display-title";
    })[0];
    var accent = fields.filter(function (f) {
      return f.kind === "display-accent";
    })[0];
    if (title || accent) {
      var hh = h(big ? "h1" : "h2", { class: "sechead__title" });
      if (title) hh.appendChild(field(title, page, section, null, { big: big, ink: ink }));
      if (accent) hh.appendChild(field(accent, page, section, null, { big: big, ink: ink }));
      head.appendChild(hh);
    }
    var lede = fields.filter(function (f) {
      return f.kind === "lede";
    })[0];
    if (lede) head.appendChild(field(lede, page, section, null, { ink: ink }));
    return head;
  }

  /* ---- repeatable groups -------------------------------------------------- */
  function repeatable(page, section) {
    var list = instances(page, section);
    var ink = section.ink;
    var box = h("div", { class: "rep" });
    var host;

    if (section.layout === "stats") host = h("dl", { class: "statrow" });
    else if (section.layout === "marquee") host = h("div", { class: "strip" });
    else if (section.layout === "cards") host = h("div", { class: "grid grid--" + (section.layout === "stats" ? 4 : 3) });
    else host = h("div", { class: "rep" });
    box.appendChild(host);

    list.forEach(function (inst, idx) {
      host.appendChild(instanceNode(page, section, inst, idx, list.length));
    });

    if (list.length < section.repeat.max) {
      var add = h(
        "button",
        {
          class: "minib rep__add",
          type: "button",
          onclick: function () {
            state.r[repKey(page, section.id)] = list.concat([newId()]);
            persist();
            renderStage();
          },
        },
        [ring("xs", "dual", "accent"), "Add another " + section.repeat.noun]
      );
      box.appendChild(add);
    }
    if (section.repeat.suggested > list.length) {
      box.appendChild(
        h("p", {
          class: "label",
          style: "color:var(--ink-55)",
          text: "Suggested: about " + section.repeat.suggested + " " + section.repeat.noun + "s",
        })
      );
    }
    return box;
  }

  function instanceNode(page, section, inst, idx, total) {
    var ink = section.ink;
    var fields = section.fields;
    var headFields = fields.filter(function (f) {
      return HEAD_KINDS[f.kind];
    });
    var rest = fields.filter(function (f) {
      return !HEAD_KINDS[f.kind];
    });

    var tools = h("div", { class: "rep__tools" }, [
      h("span", {
        class: "label",
        style: "color:var(--ink-40);margin-right:auto",
        text: section.repeat.noun + " " + (idx + 1),
      }),
      h(
        "button",
        {
          class: "minib",
          type: "button",
          disabled: total <= section.repeat.min,
          onclick: function () {
            var list = state.r[repKey(page, section.id)].slice();
            list.splice(idx, 1);
            state.r[repKey(page, section.id)] = list;
            Object.keys(state.v).forEach(function (k) {
              if (k.indexOf(page + "." + section.id + "#" + inst + ".") === 0) delete state.v[k];
            });
            persist();
            renderStage();
          },
        },
        ["Remove"]
      ),
    ]);

    var body = h("div", { class: "stack" });
    rest.forEach(function (f) {
      body.appendChild(field(f, page, section, inst, { ink: ink, btn: "btn--outline" }));
    });

    var inner, node;
    switch (section.layout) {
      case "stats":
        node = h("div", {});
        headFields.concat(rest).forEach(function (f) {
          node.appendChild(field(f, page, section, inst, { ink: ink }));
        });
        node.insertBefore(tools, node.firstChild);
        return node;

      case "marquee":
        node = h("div", { class: "strip__item" }, [tools]);
        fields.forEach(function (f) {
          node.appendChild(field(f, page, section, inst, { ink: ink }));
        });
        return node;

      case "cards":
        inner = h("article", { class: "card" }, [
          h("span", { class: "card__trace", "aria-hidden": "true" }, [
            h("span", { class: "t" }),
            h("span", { class: "r" }),
            h("span", { class: "b" }),
            h("span", { class: "l" }),
          ]),
        ]);
        inner.appendChild(tools);
        headFields.forEach(function (f) {
          var w = field(f, page, section, inst, { ink: ink });
          if (f.kind === "display-title") {
            var t = h("h3", { class: "card__title" }, [w]);
            inner.appendChild(t);
          } else inner.appendChild(w);
        });
        inner.appendChild(body);
        return inner;

      case "faq":
        var det = h("details", { class: "acc", open: idx === 0 ? "" : null });
        var sum = h("summary", {});
        var qf = fields[0];
        sum.appendChild(field(qf, page, section, inst, { ink: ink }));
        sum.appendChild(
          h("span", { class: "acc__mark" }, [
            ring("md", "outline", "accent"),
            ring("md", "dual", "accent"),
          ])
        );
        det.appendChild(sum);
        var ab = h("div", { class: "acc__body" }, [tools]);
        fields.slice(1).forEach(function (f) {
          ab.appendChild(field(f, page, section, inst, { ink: ink }));
        });
        det.appendChild(ab);
        return det;

      default:
        // list / event / program — a bordered block with its head fields on top
        inner = h("div", { class: "repblock" });
        inner.appendChild(tools);
        var hd = h("div", { class: "stack-sm repblock__head" });
        headFields.forEach(function (f) {
          hd.appendChild(field(f, page, section, inst, { ink: ink }));
        });
        if (headFields.length) inner.appendChild(hd);
        inner.appendChild(
          section.layout === "event" || section.layout === "program"
            ? gridBody(rest, page, section, inst, ink)
            : body
        );
        return inner;
    }
  }

  // Events and programmes carry a lot of short practical answers. A two-column
  // grid keeps them scannable instead of running 20 one-line answers down the
  // page; the long-form fields drop back to full width.
  function gridBody(rest, page, section, inst, ink) {
    var wrap = h("div", { class: "stack" });
    var run = null;
    rest.forEach(function (f) {
      var long = MULTILINE[f.kind] || f.kind === "cta-label";
      var node = field(f, page, section, inst, { ink: ink, btn: "btn--outline" });
      if (long) {
        run = null;
        wrap.appendChild(node);
      } else {
        if (!run) {
          run = h("div", { class: "minigrid" });
          wrap.appendChild(run);
        }
        run.appendChild(node);
      }
    });
    return wrap;
  }

  /* ---- a section --------------------------------------------------------- */
  function renderSection(page, section, isFirst) {
    var ink = section.ink;
    var sec = h("section", {
      class: "section" + (ink ? " on-ink" : ""),
      id: "s-" + page + "-" + section.id,
    });
    if (ink) sec.style.background = "var(--ink)";
    var wrap = h("div", { class: "wrap stack-lg" });

    if (section.repeat) {
      var head = h("div", { class: "sechead" });
      var row = h("p", { class: "eyebrow label" }, [ring("xs", "dotted", ink ? "paper" : "accent")]);
      if (section.number) row.appendChild(h("span", { class: "eyebrow__num", text: "(" + section.number + ")" }));
      if (section.eyebrow) row.appendChild(h("span", { class: "eyebrow__text", text: section.eyebrow }));
      if (section.number || section.eyebrow) head.appendChild(row);
      if (section.purpose) head.appendChild(h("p", { class: "lede", text: section.purpose }));
      if (head.childNodes.length) wrap.appendChild(head);
      wrap.appendChild(repeatable(page, section));
    } else {
      var headFields = section.fields.filter(function (f) {
        return HEAD_KINDS[f.kind];
      });
      var rest = section.fields.filter(function (f) {
        return !HEAD_KINDS[f.kind];
      });
      var big = isFirst && section.layout === "hero";
      var head2 = sectionHead(page, section, headFields, big, ink, section.purpose);

      var body = h("div", { class: section.layout === "contact" ? "stack contactgrid" : "stack" });
      var btnRow = null;
      rest.forEach(function (f) {
        if (BTN_KINDS[f.kind]) {
          if (!btnRow) {
            btnRow = h("div", { class: "btn-row" });
            body.appendChild(btnRow);
          }
          btnRow.appendChild(
            field(f, page, section, null, { ink: ink, btn: ink ? "btn--accent" : "btn--primary" })
          );
          return;
        }
        btnRow = null;
        body.appendChild(field(f, page, section, null, { ink: ink }));
      });

      if (section.layout === "split" && rest.length) {
        wrap.appendChild(h("div", { class: "split" }, [head2, body]));
      } else {
        wrap.appendChild(head2);
        if (rest.length) wrap.appendChild(body);
      }
    }
    sec.appendChild(wrap);
    return sec;
  }

  /* ---- progress ----------------------------------------------------------- */
  function pageStats(page) {
    var total = 0,
      done = 0,
      req = 0,
      reqDone = 0,
      legalOpen = 0;
    page.sections.forEach(function (s) {
      var list = s.repeat ? instances(page.key, s) : [null];
      list.forEach(function (inst) {
        s.fields.forEach(function (f) {
          var v = get(keyOf(page.key, s.id, f.id, inst));
          total += 1;
          if (v) done += 1;
          if (f.req) {
            req += 1;
            if (v) reqDone += 1;
          }
          if (f.legal && !v) legalOpen += 1;
        });
      });
    });
    return { total: total, done: done, req: req, reqDone: reqDone, legalOpen: legalOpen };
  }

  function allStats() {
    var t = { total: 0, done: 0, req: 0, reqDone: 0, legalOpen: 0 };
    SCHEMA.forEach(function (p) {
      var s = pageStats(p);
      t.total += s.total;
      t.done += s.done;
      t.req += s.req;
      t.reqDone += s.reqDone;
      t.legalOpen += s.legalOpen;
    });
    return t;
  }

  /* ---- export ------------------------------------------------------------- */
  function exportObject() {
    var out = { brief: "Harmony Circle website content", pages: {} };
    SCHEMA.forEach(function (p) {
      var pg = {};
      p.sections.forEach(function (s) {
        if (s.repeat) {
          var arr = [];
          instances(p.key, s).forEach(function (inst) {
            var row = {};
            var any = false;
            s.fields.forEach(function (f) {
              var v = get(keyOf(p.key, s.id, f.id, inst));
              if (v) any = true;
              row[f.id] = v;
            });
            if (any) arr.push(row);
          });
          if (arr.length) pg[s.id] = arr;
        } else {
          var o = {};
          var any2 = false;
          s.fields.forEach(function (f) {
            var v = get(keyOf(p.key, s.id, f.id, null));
            if (v) any2 = true;
            o[f.id] = v;
          });
          if (any2) pg[s.id] = o;
        }
      });
      if (Object.keys(pg).length) out.pages[p.key] = pg;
    });
    var st = allStats();
    out.progress = { answered: st.done, of: st.total, requiredAnswered: st.reqDone, requiredOf: st.req };
    return out;
  }

  function exportText() {
    var lines = ["HARMONY CIRCLE — WEBSITE CONTENT", ""];
    SCHEMA.forEach(function (p) {
      var st = pageStats(p);
      lines.push("=".repeat(60));
      lines.push(p.label.toUpperCase() + "   (" + p.route + ")   " + st.done + "/" + st.total);
      lines.push("=".repeat(60));
      p.sections.forEach(function (s) {
        var list = s.repeat ? instances(p.key, s) : [null];
        var header = false;
        list.forEach(function (inst, idx) {
          s.fields.forEach(function (f) {
            var v = get(keyOf(p.key, s.id, f.id, inst));
            if (!v) return;
            if (!header) {
              lines.push("");
              lines.push("-- " + (s.number ? "(" + s.number + ") " : "") + (s.eyebrow || s.id));
              header = true;
            }
            var prefix = s.repeat ? "[" + s.repeat.noun + " " + (idx + 1) + "] " : "";
            lines.push("");
            lines.push(prefix + f.label + (f.legal ? "  [LAUNCH BLOCKER]" : "") + ":");
            lines.push(v);
          });
        });
      });
      lines.push("");
    });
    var st2 = allStats();
    lines.push("");
    lines.push(
      "Answered " + st2.done + " of " + st2.total + " · required " + st2.reqDone + " of " + st2.req +
      " · launch-blocker answers still open: " + st2.legalOpen
    );
    return lines.join("\n");
  }

  /* ---- saving back into the page ------------------------------------------ */
  function buildDoc() {
    var esc = function (s) {
      return String(s).replace(/</g, "\\u003c");
    };
    var styleText = document.getElementById("hc-style").textContent;
    var schemaText = document.getElementById("hc-schema").textContent;
    var appText = document.getElementById("hc-app").textContent;
    var S = "<" + "/script>";
    var head =
      '<meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      "<title>" + TITLE + "<" + "/title>" +
      FONTS +
      '<style id="hc-style">' + styleText + "<" + "/style>";
    var body =
      '<div id="root"><' + "/div>" +
      '<script id="hc-schema" type="application/json">' + esc(schemaText) + S +
      '<script id="hc-content" type="application/json">' + esc(JSON.stringify(state)) + S +
      '<script id="hc-app">' + appText + S;
    return (
      "<!doctype html><html lang=\"en-CA\"><head>" + head + "<" + "/head><body>" + body +
      "<" + "/body><" + "/html>"
    );
  }

  var saving = false;
  function save() {
    if (saving) return;
    flush();
    saving = true;
    refreshChrome();
    toast("Saving…");
    Promise.resolve(window.claude && window.claude.use ? window.claude.use("artifact") : null)
      .then(function (artifact) {
        if (!artifact) throw new Error("unavailable");
        return artifact.publish(buildDoc());
      })
      .then(function () {
        savedRev = state.rev;
        saving = false;
        toast("Saved. Your developer can see it now.");
        refreshChrome();
      })
      .catch(function () {
        saving = false;
        refreshChrome();
        toast("Could not save to the page — use Download instead.");
        openHandoff(true);
      });
  }

  function download() {
    var text = JSON.stringify(exportObject(), null, 2);
    Promise.resolve(window.claude && window.claude.use ? window.claude.use("downloads") : null)
      .then(function (d) {
        if (!d) throw new Error("unavailable");
        return d.save({ filename: "harmony-circle-content.json", data: text });
      })
      .then(function () {
        toast("Downloaded.");
      })
      .catch(function () {
        copy(text, "JSON copied — paste it into an email.");
      });
  }

  function copy(text, msg) {
    var done = function () {
      toast(msg);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = h("textarea", {});
      ta.value = text;
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        done();
      } catch (e) {
        toast("Copy failed — select the text manually.");
      }
      document.body.removeChild(ta);
    }
  }

  var toastEl;
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("is-up");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("is-up");
    }, 3200);
  }

          h("p", { class: "eyebrow label" }, [
            ring("xs", "dotted", "accent"),
            h("span", { class: "eyebrow__num", text: "(00)" }),
            h("span", { class: "eyebrow__text", text: "How this works" }),
          ]),
          h("h2", { class: "display-3", text: "Type straight onto the page." }),
          h(
            "ul",
            { class: "notelist" },
            items.map(function (t) {
              return h("li", {}, [ring("xs", "outline", "accent"), h("span", { text: t })]);
            })
          ),
        ]),
      ]),
    ]);
  }

  function handoffPanel() {
    var st = allStats();
    return h("section", { class: "section" }, [
      h("div", { class: "wrap" }, [
        h("div", { class: "panel panel--ink" }, [
          h("p", { class: "eyebrow label" }, [
            ring("xs", "dotted", "paper"),
            h("span", { class: "eyebrow__text", style: "color:var(--paper-70)", text: "Sending it back" }),
          ]),
          h("h3", { class: "display-3", style: "color:var(--paper)", text: "Done for now?" }),
          h("p", {
            style: "margin:0;color:var(--paper-80);max-inline-size:60ch",
            text:
              "Save writes your answers into this page, so the link you were sent is also the way the work comes back — there is nothing to attach or upload. Download gives you a copy for your own records, or to email if you would rather.",
          }),
          h("p", {
            class: "label",
            style: "margin:0;color:var(--paper-60)",
            text:
              st.done + " of " + st.total + " answered · " + st.reqDone + " of " + st.req +
              " required · " + st.legalOpen + " launch-blocker answers still open",
          }),
          h("div", { class: "btn-row" }, [
            h("button", { class: "tbtn tbtn--accent", type: "button", onclick: save }, ["Save and send"]),
            h("button", { class: "tbtn", type: "button", onclick: download }, ["Download a copy"]),
            h(
              "button",
              {
                class: "tbtn",
                type: "button",
                onclick: function () {
                  copy(exportText(), "Copied — paste into an email.");
                },
              },
              ["Copy as text"]
            ),
          ]),
        ]),
      ]),
    ]);
  }

  function openHandoff() {
    var el = document.querySelector(".panel--ink");
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  /* ---- shell --------------------------------------------------------------- */
  var tabsEl, progArc, progTxt, saveBtn, modeBtns;

  function buildShell() {
    var C = 2 * Math.PI * 10;
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "prog__dial");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    function arc(cls) {
      var c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", "12");
      c.setAttribute("cy", "12");
      c.setAttribute("r", "10");
      c.setAttribute("fill", "none");
      c.setAttribute("stroke-width", "3");
      c.setAttribute("class", cls);
      return c;
    }
    svg.appendChild(arc("prog__track"));
    progArc = arc("prog__arc");
    progArc.setAttribute("stroke-linecap", "round");
    progArc.setAttribute("stroke-dasharray", C.toFixed(2));
    progArc.setAttribute("stroke-dashoffset", C.toFixed(2));
    svg.appendChild(progArc);
    progTxt = h("span", { class: "prog__txt", text: "0 / 0" });

    modeBtns = {
      fill: h(
        "button",
        { class: "tbtn", type: "button", "aria-pressed": "true", onclick: function () { setMode("fill"); } },
        ["Fill in"]
      ),
      preview: h(
        "button",
        { class: "tbtn", type: "button", "aria-pressed": "false", onclick: function () { setMode("preview"); } },
        ["Preview"]
      ),
    };

    saveBtn = h("button", { class: "tbtn tbtn--accent", type: "button", onclick: save }, ["Save"]);

    var bar = h("div", { class: "shell__bar" }, [
      h("div", { class: "shell__brand" }, [
        ring("md", "dual", "paper"),
        h("span", { class: "label" }, [
          "Harmony Circle ",
          h("span", { class: "shell__sub", text: "· content brief" }),
        ]),
      ]),
      h("span", { class: "shell__spacer" }),
      h("div", { class: "prog" }, [svg, progTxt]),
      h("div", { class: "seg" }, [modeBtns.fill, modeBtns.preview]),
      h("div", { class: "shell__actions" }, [saveBtn]),
    ]);

    tabsEl = h("div", { class: "tabs__scroll", role: "tablist", "aria-label": "Pages" });
    return h("div", { class: "shell", id: "hc-shell" }, [bar, h("div", { class: "tabs" }, [tabsEl])]);
  }

  function buildTabs() {
    tabsEl.textContent = "";
    SCHEMA.forEach(function (p) {
      var st = pageStats(p);
      var complete = st.done === st.total && st.total > 0;
      var tab = h(
        "button",
        {
          class: "tab",
          type: "button",
          role: "tab",
          "aria-selected": p.key === current ? "true" : "false",
          onclick: function () {
            go(p.key);
          },
        },
        [
          complete ? ring("xs", "solid", "accent") : null,
          h("span", { text: p.label }),
          h("span", { class: "tab__count", text: st.done + "/" + st.total }),
        ]
      );
      tabsEl.appendChild(tab);
    });
  }

  function refreshChrome() {
    var st = allStats();
    var C = 2 * Math.PI * 10;
    var pct = st.total ? st.done / st.total : 0;
    progArc.setAttribute("stroke-dashoffset", (C * (1 - pct)).toFixed(2));
    progTxt.textContent = st.done + " / " + st.total;
    saveBtn.textContent = saving ? "Saving…" : dirty() ? "Save" : "Saved";
    saveBtn.setAttribute("data-dirty", dirty() && !saving ? "true" : "false");
    saveBtn.disabled = saving;
    buildTabs();
  }

  function setMode(m) {
    mode = m;
    document.documentElement.setAttribute("data-mode", m);
    modeBtns.fill.setAttribute("aria-pressed", m === "fill" ? "true" : "false");
    modeBtns.preview.setAttribute("aria-pressed", m === "preview" ? "true" : "false");
    if (m === "preview") hideDock();
  }

  /* ---- stage ---------------------------------------------------------------- */
  var stage;

  function go(key) {
    if (!SCHEMA.some(function (p) { return p.key === key; })) return;
    current = key;
    hideDock();
    renderStage();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  function renderStage() {
    var page = SCHEMA.filter(function (p) { return p.key === current; })[0];
    stage.textContent = "";
    stage.appendChild(siteNav());

    var intro = h("section", { class: "section" }, [
      h("div", { class: "wrap stack" }, [
        h("p", { class: "eyebrow label" }, [
          ring("xs", "dotted", "accent"),
          h("span", { class: "eyebrow__text", text: page.route }),
        ]),
        h("h1", { class: "display-2", text: page.label + "." }),
        h("p", { class: "lede", text: page.blurb }),
      ]),
    ]);
    stage.appendChild(intro);

    if (page.key === "site") stage.appendChild(introPanel());

    page.sections.forEach(function (s, i) {
      stage.appendChild(renderSection(page.key, s, i === 0));
    });

    stage.appendChild(handoffPanel());
    stage.appendChild(siteFooter());
    refreshChrome();
  }

  /* ---- boot ------------------------------------------------------------------ */
  var root = document.getElementById("root");
  root.textContent = "";
  document.documentElement.setAttribute("data-mode", "fill");

  root.appendChild(buildShell());

  // The toolbar is two stacked rows whose height depends on the font actually
  // loading, so it is measured rather than assumed — the sticky site header
  // below it has to sit exactly underneath.
  function measure() {
    var el = document.getElementById("hc-shell");
    if (el) document.documentElement.style.setProperty("--shell-total", el.offsetHeight + "px");
  }
  window.addEventListener("resize", measure, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  dockLabel = h("div", { class: "dock__label" });
  dockHelp = h("p", { class: "dock__help" });
  dockShape = h("p", { class: "dock__shape" });
  dockCount = h("span", { class: "dock__count" });
  dock = h("div", { class: "dock" }, [
    h("div", { class: "dock__in" }, [
      h("div", { class: "dock__body" }, [dockLabel, dockHelp, dockShape]),
      h("div", { class: "dock__side" }, [
        dockCount,
        h(
          "button",
          { class: "dock__close", type: "button", "aria-label": "Close guidance", onclick: hideDock },
          [ring("md", "dual", "paper")]
        ),
      ]),
    ]),
  ]);

  stage = h("div", { class: "stage" });
  root.appendChild(stage);
  root.appendChild(dock);
  toastEl = h("div", { class: "toast", role: "status", "aria-live": "polite" });
  root.appendChild(toastEl);

  renderStage();
  measure();
  setTimeout(measure, 300);

  window.addEventListener("beforeunload", function (e) {
    if (!dirty()) return;
    e.preventDefault();
    e.returnValue = "";
  });
})();

</script>
