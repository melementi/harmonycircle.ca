<title>Harmony Circle Content Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style id="hc-style">
/* ===========================================================================
   Harmony Circle — content brief.
   The three brand hexes are the project's, resolved out of Tailwind so this
   page stands alone. Nothing here introduces a fourth colour: every other
   value is one of the three at an opacity step.
   =========================================================================== */
:root{
  --ink:#0f3b3c;
  --accent:#b54d2c;
  --paper:#f6f2ea;

  --ink-90:rgba(15,59,60,.90);
  --ink-80:rgba(15,59,60,.80);
  --ink-70:rgba(15,59,60,.70);
  --ink-55:rgba(15,59,60,.55);
  --ink-40:rgba(15,59,60,.40);
  --ink-25:rgba(15,59,60,.25);
  --ink-15:rgba(15,59,60,.15);
  --ink-10:rgba(15,59,60,.10);
  --ink-06:rgba(15,59,60,.06);

  --paper-80:rgba(246,242,234,.80);
  --paper-70:rgba(246,242,234,.70);
  --paper-60:rgba(246,242,234,.60);
  --paper-50:rgba(246,242,234,.50);
  --paper-15:rgba(246,242,234,.15);
  --paper-08:rgba(246,242,234,.08);

  --accent-70:rgba(181,77,44,.70);
  --accent-30:rgba(181,77,44,.30);
  --accent-12:rgba(181,77,44,.12);

  --sans:"Inter","Inter Variable",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","JetBrains Mono Variable",ui-monospace,"SFMono-Regular",Menlo,monospace;

  --shell:56px;      /* editor toolbar height */
  --dock:0px;        /* inspector height, set by script */
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}

/* This page commits to one visual world — the brand's warm-bone ground. It is
   the site being previewed, so it does not follow the viewer's theme; every
   colour is painted explicitly so it holds on either host ground. */
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.on-ink :focus-visible,.on-ink:focus-visible{outline-color:var(--paper)}
img{max-width:100%}
p,li{text-wrap:pretty}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}

/* --- register one: display ------------------------------------------------ */
.display-1{font-weight:900;text-transform:uppercase;letter-spacing:-.05em;line-height:.85;font-size:clamp(2.75rem,11vw,7rem)}
.display-2{font-weight:900;text-transform:uppercase;letter-spacing:-.05em;line-height:.85;font-size:clamp(2rem,6.5vw,4.5rem)}
.display-3{font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:.95;font-size:clamp(1.375rem,3vw,2rem)}

/* --- register two: micro-label -------------------------------------------- */
.label{font-family:var(--mono);text-transform:uppercase;letter-spacing:.25em;font-size:.625rem;line-height:1.6}

/* --- everything else is body ---------------------------------------------- */
.lede{font-size:1rem;line-height:1.625;color:var(--ink-80);max-inline-size:45ch}
@media(min-width:768px){.lede{font-size:1.125rem}}
.body-copy{font-size:1rem;line-height:1.625;color:var(--ink-80);max-inline-size:65ch}
@media(min-width:768px){.body-copy{font-size:1.125rem}}
.on-ink .lede,.on-ink .body-copy{color:var(--paper-80)}

/* --- the ring ------------------------------------------------------------- */
.ring{display:inline-block;flex-shrink:0;vertical-align:middle}
.ring--accent{color:var(--accent)}
.ring--ink{color:var(--ink)}
.ring--paper{color:var(--paper)}

/* --- layout --------------------------------------------------------------- */
.wrap{max-width:1440px;margin-inline:auto;padding-inline:24px}
@media(min-width:768px){.wrap{padding-inline:40px}}
@media(min-width:1024px){.wrap{padding-inline:64px}}
.section{border-top:1px solid var(--ink-10);padding-block:80px}
@media(min-width:768px){.section{padding-block:112px}}
@media(min-width:1024px){.section{padding-block:128px}}
.section:first-of-type{border-top:0}
.on-ink .section{border-top-color:var(--paper-15)}
.stack{display:flex;flex-direction:column;gap:24px}
.stack-sm{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:48px}

/* ===========================================================================
   Site chrome — Nav, Footer, and the component library, rebuilt in plain CSS
   from src/components/*.astro so this page stands alone.
   =========================================================================== */
.sitenav{position:sticky;top:var(--shell);z-index:30;border-bottom:1px solid var(--ink-10);background:rgba(246,242,234,.85);backdrop-filter:blur(6px)}
.sitenav__in{display:flex;align-items:center;justify-content:space-between;gap:12px}
@media(min-width:768px){.sitenav__in{gap:32px}}
.sitenav .wrap{padding-block:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand .label{white-space:nowrap}
.sitenav__links{display:none}
@media(min-width:1100px){.sitenav__links{display:block}}
.sitenav__links ul{display:flex;align-items:center;gap:32px;list-style:none;margin:0;padding:0}
.sitenav__links a{display:flex;align-items:center;gap:8px;padding-block:8px;text-decoration:none;color:var(--ink-70);transition:color .2s}
.sitenav__links a:hover{color:var(--ink)}
.sitenav__links a[aria-current="page"]{color:var(--ink)}
.sitenav__links .ring{visibility:hidden}
.sitenav__links a[aria-current="page"] .ring{visibility:visible}

/* --- buttons -------------------------------------------------------------- */
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;
  overflow:hidden;border-radius:999px;border:0;cursor:pointer;text-decoration:none;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.25em;font-size:.625rem;
  min-height:44px;padding:14px 28px;
  transition:color .3s,background-color .3s,border-color .3s,box-shadow .3s;
}
.btn--sm{padding:10px 20px}
.btn--primary{background:var(--ink);color:var(--paper)}
.btn--primary:hover{box-shadow:0 0 50px -12px rgba(15,59,60,.55)}
.btn--accent{background:var(--accent);color:#fff}
.btn--accent:hover{box-shadow:0 0 50px -12px rgba(181,77,44,.55)}
.btn--outline{background:transparent;border:1px solid var(--ink-25);color:var(--ink)}
.btn--outline:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.btn--ghost{background:transparent;color:var(--ink-70)}
.btn--ghost:hover{color:var(--ink)}
.btn__sheen{position:absolute;inset-block:0;left:-100%;width:50%;background:rgba(255,255,255,.15);pointer-events:none}
.btn:hover .btn__sheen{animation:shimmer-sweep .9s ease-out}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-row{display:flex;flex-wrap:wrap;gap:16px}

@keyframes shimmer-sweep{from{transform:translateX(-100%) skewX(-12deg)}to{transform:translateX(200%) skewX(-12deg)}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 0 0 rgba(181,77,44,.45)}50%{box-shadow:0 0 40px -8px rgba(181,77,44,.6)}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes ring-expand{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* --- section header ------------------------------------------------------- */
.sechead{display:flex;flex-direction:column;gap:24px}
.eyebrow{display:flex;align-items:center;gap:12px;margin:0;flex-wrap:wrap}
.eyebrow__num{color:var(--accent)}
.eyebrow__text{color:var(--ink-70)}
.on-ink .eyebrow__num{color:var(--paper-70)}
.on-ink .eyebrow__text{color:var(--paper-70)}
.accent-line{color:var(--accent);display:block}
.on-ink .accent-line{color:var(--paper-50)}
.on-ink .display-1,.on-ink .display-2,.on-ink .display-3{color:var(--paper)}

/* --- card ----------------------------------------------------------------- */
.card{position:relative;display:flex;flex-direction:column;gap:16px;border:1px solid var(--ink-15);padding:24px;transition:border-color .3s}
@media(min-width:768px){.card{padding:32px}}
.on-ink .card{border-color:var(--paper-15)}
.card__trace{position:absolute;inset:0;pointer-events:none}
.card__trace span{position:absolute;background:var(--accent);transition:transform .3s}
.card__trace .t{inset-inline:0;top:0;height:1px;transform:scaleX(0);transform-origin:left}
.card__trace .r{inset-block:0;right:0;width:1px;transform:scaleY(0);transform-origin:top;transition-delay:.1s}
.card__trace .b{inset-inline:0;bottom:0;height:1px;transform:scaleX(0);transform-origin:right;transition-delay:.2s}
.card__trace .l{inset-block:0;left:0;width:1px;transform:scaleY(0);transform-origin:bottom;transition-delay:.3s}
.card:hover .card__trace .t,.card:hover .card__trace .b{transform:scaleX(1)}
.card:hover .card__trace .r,.card:hover .card__trace .l{transform:scaleY(1)}
.card__eyebrow{display:flex;align-items:center;gap:8px;color:var(--ink-70);margin:0}
.on-ink .card__eyebrow{color:var(--paper-60)}
.card__body{font-size:1rem;line-height:1.625;color:var(--ink-80)}
.on-ink .card__body{color:var(--paper-80)}
.card__meta{margin-top:auto;color:var(--ink-70)}
.on-ink .card__meta{color:var(--paper-60)}
.grid{display:grid;gap:24px}
@media(min-width:768px){.grid{gap:32px}.grid--2{grid-template-columns:repeat(2,1fr)}.grid--3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid--4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:768px) and (max-width:1023px){.grid--4{grid-template-columns:repeat(2,1fr)}}
.split{display:grid;gap:32px}
@media(min-width:1024px){.split{grid-template-columns:5fr 7fr;gap:64px}}

/* --- stat row ------------------------------------------------------------- */
.statrow{display:grid;grid-template-columns:repeat(2,1fr);margin:0}
@media(min-width:768px){.statrow{grid-template-columns:repeat(4,1fr)}}
.statrow>div{display:flex;flex-direction:column;gap:8px;padding:24px 16px;border-left:1px solid var(--ink-10);border-top:1px solid var(--ink-10)}
@media(min-width:768px){.statrow>div{padding-inline:32px;border-top:0}}
.statrow>div:first-child{border-left:0;padding-left:0}
@media(max-width:767px){.statrow>div:nth-child(odd){border-left:0;padding-left:0}.statrow>div:nth-child(-n+2){border-top:0}}
.statrow dd{margin:0}
.statrow dt{color:var(--ink-70)}
.on-ink .statrow>div{border-color:var(--paper-15)}
.on-ink .statrow dt{color:var(--paper-70)}

/* --- accordion ------------------------------------------------------------ */
.acc{border-bottom:1px solid var(--ink-10)}
.acc>summary{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:20px;cursor:pointer;list-style:none;font-size:1rem;font-weight:500}
@media(min-width:768px){.acc>summary{font-size:1.125rem}}
.acc>summary::-webkit-details-marker{display:none}
.acc__mark{display:grid;place-items:center;width:16px;height:16px;flex-shrink:0}
.acc__mark .ring{grid-area:1/1;transition:opacity .3s}
.acc:not([open]) .acc__mark .ring--dual{opacity:0}
.acc[open] .acc__mark .ring--outline{opacity:0}
.acc__body{padding-bottom:24px;color:var(--ink-80);max-inline-size:65ch}

/* --- marquee -------------------------------------------------------------- */
.marquee{position:relative;display:flex;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent)}
.marquee ul{display:flex;flex-shrink:0;align-items:center;gap:64px;padding:0 64px 0 0;margin:0;list-style:none;animation:marquee 40s linear infinite}
.marquee li{white-space:nowrap;color:var(--ink-70)}

/* --- footer --------------------------------------------------------------- */
.sitefoot{background:var(--ink);color:var(--paper)}
.sitefoot .wrap{padding-block:64px}
@media(min-width:768px){.sitefoot .wrap{padding-block:80px}}
.foot__grid{display:grid;gap:48px}
@media(min-width:1024px){.foot__grid{grid-template-columns:2fr 1fr 1fr 1fr}}
.foot__col{display:flex;flex-direction:column;gap:16px}
.foot__col h2{color:var(--paper-60);font-size:.625rem}
.foot__col ul{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.foot__col a{color:var(--paper-80);text-decoration:none}
.foot__col a:hover{color:var(--paper)}
.foot__addr{display:flex;flex-direction:column;gap:4px;font-style:normal;font-size:.875rem;color:var(--paper-70)}
.foot__base{margin-top:64px;padding-top:32px;border-top:1px solid var(--paper-15);display:flex;flex-direction:column;gap:16px}
@media(min-width:768px){.foot__base{flex-direction:row;justify-content:space-between;align-items:flex-start}}
.foot__base p{margin:0;color:var(--paper-60);font-size:.875rem}
.foot__base .label{font-size:.625rem;flex-shrink:0}

/* ===========================================================================
   The editing layer. Deliberately reads as tooling laid over the site: ink
   chrome top and bottom, the warm ground between them untouched, so what the
   client scrolls through is the page as it will ship.
   =========================================================================== */
.shell{
  position:fixed;top:0;left:0;right:0;z-index:60;
  background:var(--ink);color:var(--paper);
  border-bottom:1px solid var(--paper-15);
}
.shell__bar{display:flex;align-items:center;gap:16px;height:var(--shell);padding-inline:16px;max-width:1440px;margin-inline:auto}
@media(min-width:1024px){.shell__bar{padding-inline:24px}}
.shell__brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.shell__brand .label{color:var(--paper);white-space:nowrap}
.shell__brand .shell__sub{color:var(--paper-60);display:none}
@media(min-width:900px){.shell__brand .shell__sub{display:inline}}
.shell__spacer{flex:1 1 auto}
.shell__actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

.tbtn{
  display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;
  border-radius:999px;border:1px solid var(--paper-15);background:transparent;color:var(--paper-80);
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:.625rem;cursor:pointer;
  transition:background-color .2s,color .2s,border-color .2s;white-space:nowrap;
}
.tbtn:hover{background:var(--paper-08);color:var(--paper)}
.tbtn[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tbtn--accent{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn--accent:hover{background:var(--accent);color:#fff;box-shadow:0 0 40px -10px rgba(181,77,44,.8)}
.tbtn--accent[data-dirty="true"]{animation:glow-pulse 2.4s ease-in-out infinite}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn__icon{width:14px;height:14px;flex-shrink:0}

.seg{display:flex;border:1px solid var(--paper-15);border-radius:999px;overflow:hidden}
.seg .tbtn{border:0;border-radius:0;min-height:34px}

/* progress */
.prog{display:none;align-items:center;gap:10px;flex-shrink:0}
@media(min-width:760px){.prog{display:flex}}
.prog__dial{width:26px;height:26px;flex-shrink:0;transform:rotate(-90deg)}
.prog__track{stroke:var(--paper-15)}
.prog__arc{stroke:var(--accent);transition:stroke-dashoffset .4s var(--ease)}
.prog__txt{font-family:var(--mono);font-size:.625rem;letter-spacing:.18em;color:var(--paper-70);white-space:nowrap;font-variant-numeric:tabular-nums}

/* page tabs */
.tabs{border-top:1px solid var(--paper-15);background:var(--ink)}
.tabs__scroll{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;max-width:1440px;margin-inline:auto;padding:0 12px}
@media(min-width:1024px){.tabs__scroll{padding-inline:20px}}
.tab{
  display:flex;align-items:center;gap:8px;padding:10px 12px;background:transparent;border:0;cursor:pointer;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:.625rem;color:var(--paper-60);
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;
}
.tab:hover{color:var(--paper)}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--accent)}
.tab__count{font-variant-numeric:tabular-nums;color:var(--paper-50)}
.tab[aria-selected="true"] .tab__count{color:var(--paper-70)}
.tab__done{color:var(--accent)}

/* page offset for the fixed shell */
.stage{padding-top:calc(var(--shell) + 41px);padding-bottom:var(--dock)}

/* --- the editable field --------------------------------------------------- */
.f{position:relative;display:block}
.f__chip{
  display:none;align-items:center;gap:6px;margin-bottom:6px;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em;font-size:.5625rem;color:var(--ink-55);
}
.on-ink .f__chip{color:var(--paper-60)}
.f__chip b{font-weight:400}
.f__chip .tagl{color:var(--accent);font-weight:500}
.on-ink .f__chip .tagl{color:var(--paper)}
[data-mode="fill"] .f__chip{display:flex}

.e{
  display:block;min-height:1em;border-radius:3px;
  transition:outline-color .2s,background-color .2s;
  outline:1px solid transparent;outline-offset:4px;
}
[data-mode="fill"] .e{outline-color:var(--ink-15);cursor:text}
[data-mode="fill"] .e:hover{background:var(--accent-12);outline-color:var(--ink-25)}
[data-mode="fill"] .e.is-empty{outline-style:dashed;outline-color:var(--ink-25)}
[data-mode="fill"] .e.is-legal{outline-color:var(--accent-30)}
[data-mode="fill"] .e.is-legal.is-empty{outline-color:var(--accent-70)}
.e:focus{outline:2px solid var(--accent)!important;outline-offset:4px;background:transparent!important}
[data-mode="fill"] .on-ink .e{outline-color:var(--paper-15)}
[data-mode="fill"] .on-ink .e:hover{background:var(--paper-08);outline-color:var(--paper-50)}
.e.is-empty::before{content:attr(data-ph);color:var(--ink-40);pointer-events:none}
.on-ink .e.is-empty::before{color:var(--paper-50)}
.e.is-empty.e--display::before{color:var(--ink-25)}
.on-ink .e.is-empty.e--display::before{color:var(--paper-50)}
/* Preview hides the scaffolding but keeps unfilled slots legible, so the page
   still reads as a page rather than collapsing into gaps. */
[data-mode="preview"] .e{outline:none}
[data-mode="preview"] .e.is-empty::before{color:var(--ink-25)}

/* --- repeatable groups ---------------------------------------------------- */
.rep{display:flex;flex-direction:column;gap:24px}
.rep__item{position:relative}
.rep__tools{display:none;justify-content:flex-end;gap:6px;margin-bottom:8px}
[data-mode="fill"] .rep__tools{display:flex}
.minib{
  display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;
  border:1px solid var(--ink-15);background:transparent;color:var(--ink-70);cursor:pointer;
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:.5625rem;transition:all .2s;
}
.minib:hover{border-color:var(--accent);color:var(--accent)}
.minib:disabled{opacity:.35;pointer-events:none}
.on-ink .minib{border-color:var(--paper-15);color:var(--paper-70)}
.on-ink .minib:hover{border-color:var(--paper);color:var(--paper)}
.rep__add{display:none;align-self:flex-start}
[data-mode="fill"] .rep__add{display:inline-flex}

/* --- the inspector dock --------------------------------------------------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:var(--ink);color:var(--paper);border-top:1px solid var(--paper-15);
  transform:translateY(100%);transition:transform .3s var(--ease);
}
.dock.is-open{transform:none}
.dock__in{max-width:1440px;margin-inline:auto;padding:14px 16px;display:flex;gap:16px;align-items:flex-start}
@media(min-width:1024px){.dock__in{padding-inline:24px}}
.dock__body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.dock__label{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--paper);font-family:var(--mono);text-transform:uppercase;letter-spacing:.2em;font-size:.625rem}
.dock__help{margin:0;color:var(--paper-80);font-size:.875rem;line-height:1.5;max-inline-size:80ch}
.dock__shape{margin:0;color:var(--paper-60);font-size:.8125rem;line-height:1.5}
.dock__shape b{font-weight:500;color:var(--paper-80)}
.dock__side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.dock__count{font-family:var(--mono);font-size:.625rem;letter-spacing:.15em;color:var(--paper-60);font-variant-numeric:tabular-nums}
.dock__count.is-over{color:#ffb4a0}
.dock__close{background:transparent;border:0;color:var(--paper-60);cursor:pointer;padding:4px;line-height:0}
.dock__close:hover{color:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-family:var(--mono);font-size:.5625rem;letter-spacing:.18em;text-transform:uppercase}
.pill--legal{background:var(--accent);color:#fff}
.pill--req{border:1px solid var(--paper-15);color:var(--paper-70)}

/* --- intro / handoff panels ----------------------------------------------- */
.panel{border:1px solid var(--ink-15);padding:24px;display:flex;flex-direction:column;gap:16px;background:rgba(255,255,255,.45)}
@media(min-width:768px){.panel{padding:32px}}
.panel--ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel h3{margin:0}
.notelist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.notelist li{display:flex;gap:12px;align-items:flex-start;font-size:.9375rem;line-height:1.55;color:var(--ink-80)}
.panel--ink .notelist li{color:var(--paper-80)}
.notelist .ring{margin-top:6px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:70;
  background:var(--ink);color:var(--paper);border:1px solid var(--paper-15);
  padding:12px 20px;border-radius:999px;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.2em;text-transform:uppercase;transition:transform .35s var(--ease);
  max-width:calc(100vw - 32px);text-align:center;
}
.toast.is-up{transform:translate(-50%,0)}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .marquee ul{animation-play-state:paused}
  .marquee{overflow-x:auto;-webkit-mask-image:none;mask-image:none}
}

/* --- classes the renderer builds ------------------------------------------ */
.stage{padding-top:var(--shell-total,97px)}
.sitenav{top:var(--shell-total,97px)}

.sechead__title .e{display:block}
.card__title{margin:0}
.card__title .e{display:block}
.purpose{margin:0;color:var(--ink-70);font-size:.9375rem;line-height:1.55;max-inline-size:58ch}
.on-ink .purpose{color:var(--paper-70)}

.repblock{position:relative;border:1px solid var(--ink-15);padding:20px;display:flex;flex-direction:column;gap:20px;background:rgba(255,255,255,.35)}
@media(min-width:768px){.repblock{padding:28px}}
.repblock__head{padding-bottom:16px;border-bottom:1px solid var(--ink-10)}
.repblock__head .display-2{font-size:clamp(1.5rem,3.4vw,2.25rem)}
.rep>.rep{gap:20px}

.minigrid{display:grid;gap:16px 24px}
@media(min-width:640px){.minigrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1180px){.minigrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

.contactgrid{gap:20px}
@media(min-width:900px){.contactgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 40px}}

.strip{display:flex;flex-wrap:wrap;gap:16px}
.strip__item{border:1px solid var(--ink-15);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:220px;flex:1 1 240px;background:rgba(255,255,255,.35)}

.e--short{font-size:1rem;line-height:1.55;color:var(--ink-90)}
.on-ink .e--short{color:var(--paper)}
[data-mode="fill"] .e--short,[data-mode="fill"] .lede.e,[data-mode="fill"] .body-copy.e{min-height:1.6em}
.f--inline{display:inline-flex;align-items:center}
.f--inline .f__chip{display:none!important}
.f--inline .e{color:var(--ink-70)}
.on-ink .f--inline .e{color:var(--paper-70)}

/* a button's wording is edited inside the button, so the button itself must
   not swallow the caret */
.btn .e{color:inherit;outline-offset:2px;min-width:4ch}
[data-mode="fill"] .btn .e{outline-color:rgba(255,255,255,.45)}
[data-mode="fill"] .btn--outline .e{outline-color:var(--ink-25)}
.btn .e.is-empty::before{color:inherit;opacity:.6}

/* choice fields are a real select — a dropdown is the honest control for a
   fixed set of answers, and it is the one place the client cannot mistype */
.sel{
  appearance:none;-webkit-appearance:none;
  font-family:var(--mono);font-size:.6875rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);background:#fff;border:1px solid var(--ink-25);border-radius:3px;
  padding:11px 34px 11px 12px;min-height:44px;width:100%;max-width:44ch;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.sel.is-empty{color:var(--ink-55);border-style:dashed;border-color:var(--accent-70)}
.on-ink .sel{background-color:rgba(255,255,255,.94)}

.tok{font-family:var(--mono);font-size:.6875rem;letter-spacing:.08em;color:var(--paper-50)}

/* the site footer at the foot of the stage mirrors the Site-wide answers and
   is deliberately not editable here — one question, one place to answer it */
.sitefoot .e{pointer-events:none}

/* An empty headline slot holds a label-sized prompt, not a seven-rem one.
   The moment a word is typed the field snaps to its real display size, which
   is the point of editing in the page rather than in a form: the client sees
   a headline that is too long as a headline that is too long. */
.e--display.is-empty{
  font-family:var(--mono);font-size:.6875rem;font-weight:500;line-height:1.9;
  letter-spacing:.2em;text-transform:uppercase;
}
.accent-line.is-empty::before{color:var(--accent-70)}
.on-ink .accent-line.is-empty::before{color:var(--paper-50)}

.section--intro{padding-block:44px}
@media(min-width:768px){.section--intro{padding-block:56px}}
.section--intro .display-2{font-size:clamp(1.75rem,4.5vw,3rem)}

/* The two headline lines are separate answers, so in fill mode they need air
   between them for their own labels. In preview they close back up into the
   single headline they actually are. */
[data-mode="fill"] .sechead__title,[data-mode="fill"] .card__title{display:flex;flex-direction:column;gap:10px}

/* At phone width the toolbar becomes two rows: identity and Save on top, the
   mode switch full width underneath. The shell's height is measured at
   runtime, so the sticky site header follows it down. */
@media(max-width:640px){
  .shell__bar{height:auto;min-height:0;padding-block:10px;flex-wrap:wrap;row-gap:10px;gap:10px}
  .shell__spacer{display:none}
  .shell__brand{order:1;min-width:0}
  .shell__actions{order:2;margin-left:auto}
  .seg{order:3;flex:1 1 100%}
  .seg .tbtn{flex:1 1 0;justify-content:center}
  .dock__in{flex-direction:column;gap:10px;padding-block:12px}
  .dock__side{flex-direction:row;align-items:center;align-self:stretch;justify-content:space-between}
}

e,"token":"{{LEGAL_ENTITY_NAME}}","ph":""}],"repeat":null,"ink":false},{"id":"reach","number":"02","eyebrow":"Reach us","purpose":"The address, phone and email in the footer and on the contact page. Every one of these is a launch blocker — the site cannot go live with a guess in any of them.","layout":"contact","fields":[{"id":"has-public-space","label":"Do you have a place the public can visit?","help":"Answer this first, because it changes what we print. If you have no space open to the public, we will not show a street address or opening hours anywhere on the site, and the contact page will lead with the form instead of a map.","kind":"choice","max":0,"req":true,"legal":true,"token":"{{STREET_ADDRESS}}","ph":"","choices":["Yes — a space the public can visit during set hours","Yes — but by appointment only","No — we have no public space"]},{"id":"street-address","label":"Street address in London, Ontario","help":"The address exactly as Canada Post would write it, including unit number and postal code, only if you answered yes above. Copy it from a document you already have. Leave blank if there is no public space — we will never write a placeholder address, because a wrong address sends people to a stranger's door.","kind":"longtext","max":160,"req":false,"legal":true,"token":"{{STREET_ADDRESS}}","ph":""},{"id":"mailing-address","label":"Mailing address, if letters go somewhere else","help":"Only fill this in if post should go to a different address from the one above — a PO box or a director's business address, for example. Leave blank if they are the same.","kind":"longtext","max":160,"req":false,"legal":true,"token":"{{MAILING_ADDRESS}}","ph":""},{"id":"phone","label":"Phone number for the public","help":"A number someone will actually answer or that has a voicemail greeting in place. Write it the way you want it printed. Leave blank if you would rather people only reach you by email — an unanswered number is worse than no number.","kind":"phone","max":24,"req":false,"legal":true,"token":"{{PHONE}}","ph":""},{"id":"email-general","label":"General enquiries email address","help":"The address for ordinary questions from the public. Use a shared mailbox the organisation controls rather than one person's personal account, so it survives a volunteer moving on. Check it before you send it to us — this address is printed on every page.","kind":"email","max":80,"req":true,"legal":true,"token":"{{EMAIL_GENERAL}}","ph":""},{"id":"email-accessibility","label":"Email for accessibility problems","help":"Ontario's accessibility rules require a route for someone to report a barrier on the site or at your events, and to ask for information in another format. It can be the same address as above, but someone has to commit to reading it and replying. Tell us which address to publish.","kind":"email","max":80,"req":true,"legal":true,"token":"{{EMAIL_ACCESSIBILITY}}","ph":""},{"id":"hours","label":"Opening hours","help":"Only if the public can visit. One line per day or per group of days, in the order you want them read. Say what happens on statutory holidays. Leave blank if you have no public space or if hours change too often to publish — out-of-date hours generate angry phone calls.","kind":"longtext","max":240,"req":false,"legal":true,"token":"{{HOURS}}","ph":""}],"repeat":null,"ink":false},{"id":"social","number":"03","eyebrow":"Follow","purpose":"Links to your accounts, shown in the footer.","layout":"list","fields":[{"id":"social-platform","label":"Which platform","help":"Pick one platform per entry, and add an entry only for an account you genuinely keep up to date. A page last posted to two years ago makes the organisation look closed.","kind":"choice","max":0,"req":true,"legal":true,"token":"{{SOCIAL_LINKS}}","ph":"","choices":["Facebook","Instagram","LinkedIn","YouTube","WhatsApp","X","TikTok"]},{"id":"social-url","label":"Full web address of the account","help":"Open the account in a browser and copy the address straight out of the address bar — the whole thing, starting with https://. Do not type it from memory and do not give us just the handle; a mistyped link sends your community to somebody else's page. We will not guess these.","kind":"url","max":200,"req":true,"legal":true,"token":"{{SOCIAL_LINKS}}","ph":""}],"repeat":{"noun":"account","min":0,"suggested":3,"max":8},"ink":false},{"id":"territory","number":"04","eyebrow":"Territory","purpose":"The land acknowledgement that closes the footer on every page.","layout":"prose","fields":[{"id":"land-acknowledgement-text","label":"Your land acknowledgement","help":"One short paragraph of about 35 to 55 words, written in your own voice, naming the territories this part of southwestern Ontario sits on. Please confirm the wording and the spelling of every Nation named with a local Indigenous organisation before you send it — this is the one paragraph on the site where borrowed wording is most likely to be wrong. If you are still consulting, tell us and we will hold the space rather than publish a draft.","kind":"body","max":420,"req":true,"legal":false,"token":"","ph":"one paragraph, 35 to 55 words"}],"repeat":null,"ink":false},{"id":"smallprint","number":"05","eyebrow":"Small print","purpose":"Charitable status. This decides the wording on the donate page and whether the site may mention tax receipts at all.","layout":"contact","fields":[{"id":"registered-charity-status","label":"Are you a registered charity with the Canada Revenue Agency?","help":"Answer honestly and from the paperwork, not from memory. This single answer decides the wording on the giving page, in the footer, in confirmation emails and on the payment screen. Being a non-profit is not the same as being a registered charity, and only a registered charity may issue tax receipts. If the answer is no or not yet, nothing on the site will suggest a donation is tax-deductible.","kind":"choice","max":0,"req":true,"legal":true,"token":"{{IS_REGISTERED_CHARITY}}","ph":"","choices":["Yes — registered with the CRA, confirmation letter in hand","No — we are a non-profit but not a registered charity","Application in progress","Not sure — we need to check"]},{"id":"cra-registration-number","label":"CRA registration or business number","help":"Only if you answered yes above. Copy it digit for digit from your CRA confirmation letter, including the letters and the last four digits. Leave blank if you are not registered. We will never invent or reconstruct this number.","kind":"short","max":24,"req":false,"legal":true,"token":"{{CRA_REGISTRATION_NUMBER}}","ph":""},{"id":"charity-status-line","label":"Approved wording for your status line","help":"The exact sentence you want printed at the bottom of every page describing what kind of organisation you are. Whoever signs off your filings should approve this sentence word for word before you send it, because it is a legal claim, not marketing copy. If you are not a registered charity, it must not use the word 'charity' or mention tax receipts. Send us the approved sentence and we will print it unchanged.","kind":"short","max":160,"req":false,"legal":true,"token":"{{CHARITY_WORDING}}","ph":""},{"id":"rights-line","label":"Wording after the copyright symbol","help":"The short phrase that follows the year and your name at the bottom of the page. Three or four words is normal and you can keep the conventional wording.","kind":"short","max":40,"req":true,"legal":false,"token":"","ph":"3 to 4 words ending in a full stop"}],"repeat":null,"ink":false},{"id":"listing","number":"06","eyebrow":"Search listing","purpose":"What Google shows when someone searches for you.","layout":"meta","fields":[{"id":"site-description","label":"Description shown in search results","help":"Two sentences, about 25 to 30 words, that appear under your name in Google and in link previews when someone shares the site. Say what you do, who it is for, and that you are in London, Ontario. Write it as a sentence for a person, not a list of keywords. Avoid any claim about charitable status or tax receipts here.","kind":"longtext","max":160,"req":true,"legal":false,"token":"","ph":"2 sentences, 25 to 30 words, under 160 characters"}],"repeat":null,"ink":false}]},{"key":"home","label":"Home","route":"/","blurb":"The front page. The headline is the first thing anyone reads, so it is worth more time than its length suggests.","sections":[{"id":"hero","number":"01","eyebrow":"Welcome","purpose":"The opening screen: a small label, a two-line headline, a paragraph and two buttons.","layout":"hero","fields":[{"id":"hero-eyebrow","label":"Small label above the headline","help":"Two or three words, printed very small in capitals above the big headline. It names the moment, not the organisation - something like a greeting or an invitation. Avoid slogans.","kind":"eyebrow","max":24,"req":true,"legal":false,"token":"","ph":"One or two words, no full stop"},{"id":"hero-title","label":"Headline - first line","help":"The first line of the very large headline. One or two words only, ending in a full stop. It is set in heavy capitals, so long words will dominate the screen on a phone.","kind":"display-title","max":22,"req":true,"legal":false,"token":"","ph":"One or two words ending in a full stop"},{"id":"hero-accent","label":"Headline - second line (terracotta)","help":"The second line of the headline, printed in terracotta orange. One or two words ending in a full stop. Read both lines aloud together - they must form one short, complete thought.","kind":"display-accent","max":22,"req":true,"legal":false,"token":"","ph":"One or two words ending in a full stop"},{"id":"hero-lede","label":"Opening paragraph","help":"25 to 45 words. Warm, plain, first person plural (we). Say who you are, who you are for, and where you are. Do not claim charitable status, do not give numbers, and do not mention tax receipts here - those all need written confirmation first.","kind":"lede","max":300,"req":true,"legal":false,"token":"","ph":"Two or ears in your own documents, and we will publish it exactly as sent.","kind":"lede","max":300,"req":true,"legal":true,"token":"{{MISSION_STATEMENT}}","ph":"Your board-approved mission wording, copied word for word"},{"id":"mission-body","label":"The story underneath","help":"40 to 90 words expanding on the mission: what the foundation actually does week to week and who it is for. Keep it to things you could describe to a neighbour. No participant numbers, no founding year and no charity wording here - those are collected separately because they need written confirmation.","kind":"body","max":650,"req":true,"legal":false,"token":"","ph":"One or two paragraphs, 40 to 90 words total"}],"repeat":null,"ink":false},{"id":"programs","number":"03","eyebrow":"Programs","purpose":"A short introduction, then three or four programme cards that link through to the full pages.","layout":"header","fields":[{"id":"programs-eyebrow","label":"Small label above the headline","help":"One or two words in capitals naming this section.","kind":"eyebrow","max":24,"req":true,"legal":false,"token":"","ph":"One or two words, no full stop"},{"id":"programs-title","label":"Headline - first line","help":"One or two words ending in a full stop.","kind":"display-title","max":22,"req":true,"legal":false,"token":"","ph":"One or two words ending in a full stop"},{"id":"programs-accent","label":"Headline - second line (terracotta)","help":"One or two words ending in a full stop, printed in terracotta, finishing the headline.","kind":"display-accent","max":22,"req":true,"legal":false,"token":"","ph":"One or two words ending in a full stop"},{"id":"programs-lede","label":"Short introduction","help":"25 to 45 words setting up the programmes below - who they are for and what they have in common. Do not list the programmes here; they appear as cards immediately underneath.","kind":"lede","max":300,"req":true,"legal":false,"token":"","ph":"Two or three sentences, 25 to 45 words"}],"repeat":null,"ink":false}, ears under the page title in a search result. Say who you are and what this page covers. Write it as one plain sentence a stranger would understand, and avoid numbers or claims you have not confirmed.","kind":"short","max":155,"req":true,"legal":false,"token":"","ph":"one sentence, 20 to 25 words, ending in a full stop"}],"repeat":null,"ink":false}]},{"key":"programs","label":"Programs","route":"/programs","blurb":"The index page, then one full page per programme. Fill in the index first, then add a programme block for each thing you run.","sections":[{"id":"hero","number":"01","eyebrow":"Programs","purpose":"","layout":"hero","fields":[{"id":"index-hero-eyebrow","label":"Small label above the headline","help":"One or two words that name this page. It prints in small capitals above the big headline, next to an automatic number. Think of it as a signpost, not a sentence. Examples of the right shape: a single word like Programs, or two words like What We Run.","kind":"eyebrow","max":22,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation"},{"id":"index-hero-title","label":"Headline, first line","help":"The big headline is printed in huge capitals and split over two lines. This is the first line. One or two words only, with no full stop — the full stop goes on the second line. Long lines look broken at this size, so keep it short and plain.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no full stop"},{"id":"index-hero-accent","label":"Headline, second line (printed in terracotta)","help":"The second line of the big headline, printed in the terracotta accent colour on its own line. One word, or two at the very most, ending in a full stop. Together with the first line it should read as one short phrase.","kind":"display-accent","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"index-hero-lede","label":"Opening sentence under the headline","help":"Two or three sentences, about 25 to 45 words, saying what kind of programmes Harmony Circle runs and who they are for. Warm and concrete, no slogans. Do not mention numbers of members or participants here — those go in the numbers strip and need to be confirmed first.","kind":"lede","max":320,"req":true,"legal":false,"token":"","ph":"25 to 45 words, 2 to 3 sentences"}],"repeat":null,"ink":false},{"id":"intro","number":"02","eyebrow":"What to expect","purpose":"What every programme has in common.","layout":"split","fields":[{"id":"intro-eyebrow","label":"Small label above this section's heading","help":"One or two words in the same style as the page label, naming this section. Something like What To Expect or How It Works.","kind":"eyebrow","max":22,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation"},{"id":"intro-title","label":"Section heading, first line","help":"A large heading split over two lines. This is the first line: one or two words, no full stop.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no full stop"},{"id":"intro-accent","label":"Section heading, second line (printed in terracotta)","help":"The closing word of the heading, printed in terracotta on its own line, ending in a full stop.","kind":"display-accent","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"intro-body","label":"What all our programmes have in common","help":"One paragraph, about 40 to 90 words. Cover the things that are true of every programme: that newcomers are welcome, whether you need to speak Turkish, whether children can come along, whether you must book ahead. Write it as if answering a nervous first-time visitor. Avoid any claim about how many people attend until those figures are confirmed.","kind":"body","max":620,"req":true,"legal":false,"token":"","ph":"one paragraph, 40 to 90 words"}],"repeat":null,"ink":false},{"id":"stats","number":"","eyebrow":"","purpose":"","layout":"stats","fields":[{"id":"stat-value","label":"The figure","help":"A single short figure, shown very large. Only supply a number you can stand behind and evidence if asked — how many programmes run each week, how many sessions you held last year, and so on. If you are not certain of the number, leave this blank and we will leave the strip out rather than guess. We will never fill this in for you.","kind":"stat-value","max":12,"req":true,"legal":true,"token":"{{PROGRAM_STATS}}","ph":"a short figure only, supplied by you; leave blank if unconfirmed"},{"id":"stat-label","label":"What the figure counts","help":"Two or three words in small capitals saying what the number above counts. It must describe the figure exactly — if the number is sessions, do not label it people. Leave blank if the figure is blank.","kind":"stat-label","max":28,"req":true,"legal":true,"token":"{{PROGRAM_STATS}}","ph":"2 to 3 words describing what is counted; supplied by you"}],"repeat":{"noun":"figure","min":0,"suggested":4,"max":4},"ink":false},{"id":"program","number":"03","eyebrow":"Each programme","purpose":"Everything for one programme: the card on the index page and the full page behind it. Add one block per programme.","layout":"program","fields":[{"id":"p-eyebrow","label":"Card category label","help":"One or two words in small capitals at the top of the card, grouping the programme by type — language, youth, culture, support, and so on. Use the same wording across cards that belong to the same family so the page reads tidily.","kind":"eyebrow","max":22,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation"},{"id":"p-title","label":"Programme name","help":"The name of the programme, one to three words. It is set in heavy capitals, so a long official name will wrap badly — give us the short everyday name people actually use and keep the full name for the programme's own page.","kind":"display-title","max":40,"req":true,"legal":false,"token":"","ph":"1 to 3 words"},{"id":"p-accent","label":"Programme headline, second line (terracotta)","help":"The second half of the headline on the programme’s own page, printed in terracotta. One or two words ending in a full stop. Together with the line above it should read as one phrase.","kind":"display-accent","max":24,"req":true,"legal":false,"token":"","ph":"One or two words ending in a full stop"},{"id":"p-summary","label":"One-line description on the card","help":"About 25 to 40 words saying what happens at this programme and who it suits. Plain language, present tense, no marketing adjectives. This is the only description a visitor reads before deciding whether to click.","kind":"body","max":260,"req":true,"legal":false,"token":"","ph":"25 to 40 words, 1 to 2 sentences"},{"id":"p-lede","label":"Opening sentence for this programme","help":"About 25 to 45 words, directly under the headline. Say what the programme is and who it is for, in the words a neighbour would use. This is also the sentence search engines are most likely to show, so make it stand on its own without the headline above it.","kind":"lede","max":320,"req":true,"legal":false,"token":"","ph":"25 to 45 words, 2 to 3 sentences"},{"id":"p-body","label":"The full description of the programme","help":"Two to four paragraphs, about 150 to 300 words in total. Walk a newcomer through a typical session from arrival to the end: what they will do, who leads it, what is provided, what they might bring. Concrete beats impressive. Leave out attendance figures, founding dates and anything about charity status or tax receipts — those are handled separately and cannot be written from memory.","kind":"longtext","max":2200,"req":true,"legal":false,"token":"","ph":"2 to 4 paragraphs, 150 to 300 words total"},{"id":"p-schedule","label":"When it runs","help":"One short line: the day, the time, and how often. Add the term or season if it only runs part of the year, and say plainly if it pauses over the summer or a holiday. Write it the way you would tell someone on the phone.","kind":"short","max":140,"req":true,"legal":false,"token":"","ph":"one line: day, time, how often, and the season if limited"},{"id":"p-location","label":"Where it takes place","help":"The name of the venue and its address. We will not write any address on the site until you send it to us in writing and confirm it is correct and may be published — a wrong address sends people to the wrong door. If the venue changes week to week, say so here instead and give us the place people should ask.","kind":"short","max":200,"req":true,"legal":true,"token":"{{STREET_ADDRESS}}","ph":""},{"id":"p-audience","label":"Who it is for","help":"About 40 to 70 words. Say who the programme suits — age range, experience level, whether you need to speak Turkish, whether parents stay, whether newcomers can join partway through. If anyone is genuinely not suited, say that kindly rather than leaving them to find out on the day.","kind":"body","max":480,"req":true,"legal":false,"token":"","ph":"one paragraph, 40 to 70 words"},{"id":"p-language","label":"Language it runs in","help":"Pick the language the sessions are actually run in. This matters to families deciding whether to bring a child who speaks only one of the two.","kind":"choice","max":0,"req":true,"legal":false,"token":"","ph":"","choices":["English","Turkish","Both English and Turkish"]},{"id":"p-cost","label":"Cost","help":"One short line. If it is free, write free in plain words. If there is a fee, give the amount and what it covers, and say what happens if someone cannot afford it. Do not describe any payment here as a donation or mention receipts — how donations and receipts work is a separate legal question still being confirmed.","kind":"short","max":140,"req":true,"legal":false,"token":"","ph":"one short line, e.g. free, or an amount and what it covers"},{"id":"p-join","label":"How to take part","help":"About 40 to 90 words setting out the steps in order: whether to register first or simply turn up, what you will be asked for, how long before someone replies, and what to do on a first visit. If places are limited or there is a waiting list, say so here rather than letting people find out after they write.","kind":"body","max":620,"req":true,"legal":false,"token":"","ph":"one paragraph, 40 to 90 words"},{"id":"p-cta-label","label":"Wording on the button","help":"Two to four words printed in capitals on the button, saying what it does — an instruction beginning with a verb, not click here.","kind":"cta-label","max":24,"req":true,"legal":false,"token":"","ph":"2 to 4 words beginning with a verb"},{"id":"p-contact-name","label":"Name of the person to ask for","help":"Only if that person has agreed in writing to have their name published on the website. If you would rather not name anyone, leave it blank and we will point people to the email address instead.","kind":"short","max":80,"req":false,"legal":true,"token":"{{STAFF}}","ph":""},{"id":"p-contact-email","label":"Email address for questions about this programme","help":"The address printed on the page for questions about this programme. Leave it blank until the address exists and someone has agreed to answer it. We will never write a plausible-looking address in place of the real one; the page will carry a marker until you supply it.","kind":"email","max":120,"req":false,"legal":true,"token":"{{EMAIL_GENERAL}}","ph":""},{"id":"p-contact-phone","label":"Phone number for questions about this programme","help":"Only fill this in if you want a number published and someone will answer it. Leave it blank otherwise — we will not put a number on the site unless you send us the real one in writing.","kind":"phone","max":40,"req":false,"legal":true,"token":"{{PHONE}}","ph":""}],"repeat":{"noun":"programme","min":1,"suggested":4,"max":12},"ink":false},{"id":"closing","number":"04","eyebrow":"Get in touch","purpose":"","layout":"band","fields":[{"id":"index-cta-eyebrow","label":"Small label above this section's heading","help":"One or two words in small capitals, such as Get In Touch or Still Looking.","kind":"eyebrow","max":22,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation"},{"id":"index-cta-title","label":"Heading, first line","help":"First line of the large heading. One or two words, no full stop.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no full stop"},{"id":"index-cta-accent","label":"Heading, second line (printed in terracotta)","help":"Closing word of the heading, printed in terracotta on its own line, ending in a full stop.","kind":"display-accent","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"index-cta-body","label":"Invitation to make contact","help":"About 40 to 70 words inviting people to ask about a programme, suggest a new one, or volunteer to help run one. Say plainly what happens when they write and roughly how long a reply takes, so the promise matches reality.","kind":"body","max":480,"req":true,"legal":false,"token":"","ph":"one paragraph, 40 to 70 words"},{"id":"index-cta-label","label":"Wording on the button","help":"The words printed on the button, two to four words, printed in capitals. Say what the button does rather than click here — for example an instruction beginning with a verb.","kind":"cta-label","max":24,"req":true,"legal":false,"token":"","ph":"2 to 4 words beginning with a verb"},{"id":"index-cta-email","label":"Email address shown beside the button","help":"The address people should write to about programmes. Leave this blank until the real address exists and someone has agreed to monitor it — we will never invent one, and the page will show a marker until you supply it.","kind":"email","max":120,"req":false,"legal":true,"token":"{{EMAIL_GENERAL}}","ph":""}],"repeat":null,"ink":true}]},{"key":"events","label":"Events","route":"/events","blurb":"The events list and one page per event. Add the events you already have dates for — more can be added at any time once the site is live.","sections":[{"id":"hero","number":"01","eyebrow":"Events","purpose":"","layout":"hero","fields":[{"id":"index-eyebrow","label":"Small label above the headline","help":"One or two words, printed very small in capitals above the big headline. It names the page. Keep it plain — a label, not a sentence.","kind":"eyebrow","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation"},{"id":"index-display-title","label":"Headline — first line","help":"The big headline is printed on two lines. This is line one: one or two words, no full stop at the end. Together both lines should be at most three words.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no ending punctuation"},{"id":"index-display-accent","label":"Headline — second line (in colour)","help":"Line two of the big headline, printed in the terracotta accent colour. One or two words and it must end with a full stop. This is the word people remember, so pick the strongest one.","kind":"display-accent","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"index-lede","label":"Welcome paragraph","help":"One short paragraph, about 25 to 45 words, sitting under the headline. Say what kind of gatherings you hold and who is welcome at them. Warm, direct, no marketing language. It is printed narrow, so long sentences will look cramped.","kind":"lede","max":300,"req":true,"legal":false,"token":"","ph":"one paragraph, 25 to 45 words"}],"repeat":null,"ink":false},{"id":"upcoming","number":"02","eyebrow":"Upcoming","purpose":"The heading over the list of events still to come, and what the page says when there are none.","layout":"header","fields":[{"id":"upcoming-eyebrow","label":"Small label above the heading","help":"One or two words in capitals, printed very small. It tells the reader this part of the page is what is coming next.","kind":"eyebrow","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words"},{"id":"upcoming-display-title","label":"Heading — first line","help":"Line one of the section heading. One or two words, no full stop.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no ending punctuation"},{"id":"upcoming-display-accent","label":"Heading — second line (in colour)","help":"Line two of the section heading, printed in the accent colour, ending with a full stop. One or two words.","kind":"display-accent","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"upcoming-empty-message","label":"Message when nothing is scheduled","help":"One or two sentences shown in place of the list whenever there is no upcoming event. It should still give the reader somewhere to go — for example, an invitation to check back or to get in touch. Write it once; it stays on the site permanently.","kind":"short","max":180,"req":true,"legal":false,"token":"","ph":"1 to 2 sentences, under 180 characters"}],"repeat":null,"ink":false},{"id":"event","number":"03","eyebrow":"Each event","purpose":"One block per event.","layout":"event","fields":[{"id":"event-name","label":"Event name","help":"The full name, written exactly as you will advertise it on posters and social media. Used in the listing, in the web address for this event, in calendar entries and in search results, so keep it consistent everywhere.","kind":"short","max":70,"req":true,"legal":false,"token":"","ph":"3 to 6 words"},{"id":"event-category","label":"Type of event","help":"One or two words printed in small capitals on the event card — the kind of gathering it is. Reuse the same words across events so the list looks tidy rather than inventing a new one each time.","kind":"eyebrow","max":20,"req":true,"legal":false,"token":"","ph":"1 to 2 words"},{"id":"event-date","label":"Date","help":"The day the event takes place. If it runs over more than one day, put the first day here and the last day in the next field.","kind":"date","max":0,"req":true,"legal":false,"token":"","ph":"a single calendar date"},{"id":"event-end-date","label":"Last day (only for multi-day events)","help":"Leave blank for a normal one-day event. Fill it in only when the event runs across several days.","kind":"date","max":0,"req":false,"legal":false,"token":"","ph":"a single calendar date"},{"id":"event-start-time","label":"Start time","help":"The time doors open or the programme begins, written the way you would say it out loud. Include am or pm so there is no confusion.","kind":"short","max":24,"req":true,"legal":false,"token":"","ph":"a clock time with am or pm"},{"id":"event-end-time","label":"Finish time","help":"Roughly when people can expect to leave. Leave blank if the finish is genuinely open-ended — do not guess a time, because people plan childcare and rides around it.","kind":"short","max":24,"req":false,"legal":false,"token":"","ph":"a clock time with am or pm"},{"id":"event-venue-name","label":"Venue name","help":"The name of the building, hall or room, written exactly as the venue itself writes it. We will not fill this in for you — send us the name only once the booking is confirmed, because a wrong venue sends people to the wrong door.","kind":"short","max":80,"req":true,"legal":true,"token":"{{STREET_ADDRESS}}","ph":""},{"id":"event-venue-address","label":"Venue address","help":"The full street address people will type into a map, including city, province and postal code. Copy it from the venue's own booking confirmation. We never write an address from memory, so this stays blank until you send it.","kind":"short","max":160,"req":true,"legal":true,"token":"{{STREET_ADDRESS}}","ph":""},{"id":"event-price","label":"Cost to attend","help":"What one person pays, in plain words — a single amount, a range, or say clearly that there is no charge. If there are different rates for members, students or children, write them all out in one short line so nobody is surprised at the door.","kind":"short","max":90,"req":true,"legal":false,"token":"","ph":"a short phrase naming amounts in Canadian dollars, or stating there is no charge"},{"id":"event-price-receipt-status","label":"Does this payment come with a tax receipt?","help":"Pick one. We cannot answer this for you and we will never write anything about tax receipts on the site until you have confirmed it in writing, because getting it wrong is a legal problem for the foundation, not a typo.","kind":"choice","max":0,"req":true,"legal":true,"token":"{{DONATION_TAX_RECEIPTABLE}}","ph":"","choices":["Not confirmed yet — say nothing about receipts on the page","No receipt is issued for this payment","A receipt is issued — we will send the exact approved wording separately"]},{"id":"event-language","label":"Language used at the event","help":"Pick one. It is printed in the event details so people know what to expect before they arrive.","kind":"choice","max":0,"req":true,"legal":false,"token":"","ph":"","choices":["English","Turkish","Both Turkish and English"]},{"id":"event-summary","label":"Short description for the list","help":"About 25 to 40 words. This is the paragraph on the event card in the list, so it has to work on its own: what happens, who it suits, why someone would come. Do not repeat the date, time or place — those are printed beside it automatically.","kind":"body","max":260,"req":true,"legal":false,"token":"","ph":"one paragraph, 25 to 40 words"},{"id":"event-description","label":"Full description for the event page","help":"Two or three short paragraphs, roughly 120 to 250 words in total. Cover what will actually happen, what to bring or wear, whether children are welcome, whether food is served, and what a first-time visitor should expect at the door. Write it as if speaking to someone who has never been to one of your events. Do not include numbers of past attendees or other statistics unless you can back them up.","kind":"longtext","max":1600,"req":true,"legal":false,"token":"","ph":"2 to 3 paragraphs, 120 to 250 words total"},{"id":"event-registration-required","label":"Do people need to reserve a spot?","help":"Pick one. This decides whether a reservation button appears on the event page, so answer it even when the answer is no.","kind":"choice","max":0,"req":true,"legal":false,"token":"","ph":"","choices":["Yes — a spot must be reserved in advance","No — anyone can simply turn up"]},{"id":"event-registration-label","label":"Wording on the reservation button","help":"Two to four words printed on the button, describing the action the visitor is about to take. Leave blank if no reservation is needed. Avoid the word 'click'.","kind":"cta-label","max":28,"req":false,"legal":false,"token":"","ph":"2 to 4 words, an action"},{"id":"event-registration-url","label":"Reservation link","help":"The web address the button opens — your booking form or ticket page. Paste it from your browser and open it once in a private window first to check it works for someone who is not signed in. Leave blank if no reservation is needed.","kind":"cta-url","max":0,"req":false,"legal":false,"token":"","ph":"a full web address starting with https://"},{"id":"event-capacity","label":"Number of spaces","help":"Optional. The number of people the room or the booking can take, if there is a firm limit. Printed as a short note so people know to reserve early. Leave blank rather than estimating — a wrong number turns people away.","kind":"short","max":40,"req":false,"legal":false,"token":"","ph":"a short phrase containing one number"},{"id":"event-registration-deadline","label":"Last day to reserve","help":"Optional. The final day you will accept reservations. Leave blank if reservations stay open until the event starts.","kind":"date","max":0,"req":false,"legal":false,"token":"","ph":"a single calendar date"},{"id":"event-accessibility-notes","label":"Access notes","help":"One or two sentences on getting in and getting around: step-free entry, lift, accessible washroom, parking, whether there is a quiet space. Only state what you have checked yourself at that venue. If you have not checked, say so plainly rather than leaving a guess on the page.","kind":"short","max":220,"req":false,"legal":false,"token":"","ph":"1 to 2 sentences"},{"id":"event-questions-email","label":"Email for questions about this event","help":"Where enquiries about this event should go. We leave this blank until you confirm the address in writing, because a mistyped address means questions vanish silently.","kind":"email","max":0,"req":false,"legal":true,"token":"{{EMAIL_GENERAL}}","ph":""}],"repeat":{"noun":"event","min":0,"suggested":3,"max":20},"ink":false},{"id":"past","number":"04","eyebrow":"Past","purpose":"The heading over the archive.","layout":"header","fields":[{"id":"past-eyebrow","label":"Small label above the heading","help":"One or two words in small capitals marking this as the archive of things already held.","kind":"eyebrow","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words"},{"id":"past-display-title","label":"Heading — first line","help":"Line one of the section heading. One or two words, no full stop.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no ending punctuation"},{"id":"past-display-accent","label":"Heading — second line (in colour)","help":"Line two of the section heading, in the accent colour, ending with a full stop.","kind":"display-accent","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"past-empty-message","label":"Message while the archive is empty","help":"One sentence shown until the first event has been and gone. Written once, and it disappears on its own afterwards.","kind":"short","max":140,"req":true,"legal":false,"token":"","ph":"one sentence"}],"repeat":null,"ink":false},{"id":"closing","number":"05","eyebrow":"Stay in touch","purpose":"","layout":"band","fields":[{"id":"closing-eyebrow","label":"Small label above the heading","help":"One or two words in small capitals introducing the invitation at the bottom of the page.","kind":"eyebrow","max":18,"req":true,"legal":false,"token":"","ph":"1 to 2 words"},{"id":"closing-display-title","label":"Heading — first line","help":"Line one of the closing heading. One or two words, no full stop.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no ending punctuation"},{"id":"closing-display-accent","label":"Heading — second line (in colour)","help":"Line two of the closing heading, in the accent colour, ending with a full stop.","kind":"display-accent","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"closing-body","label":"Invitation paragraph","help":"About 40 to 70 words. Tell people how they hear about the next gathering and what they get if they sign up. Say plainly that signing up is not a commitment and costs nothing. Do not promise how often you will write unless you are sure you can keep to it.","kind":"body","max":420,"req":true,"legal":false,"token":"","ph":"one paragraph, 40 to 70 words"},{"id":"closing-cta-label","label":"Wording on the button","help":"Two to four words describing what happens when the button is pressed.","kind":"cta-label","max":28,"req":true,"legal":false,"token":"","ph":"2 to 4 words, an action"}],"repeat":null,"ink":true}]},{"key":"getinvolved","label":"Get involved","route":"/get-involved","blurb":"Volunteering and membership, plus the wording around the sign-up form.","sections":[{"id":"hero","number":"01","eyebrow":"Get involved","purpose":"","layout":"hero","fields":[{"id":"hero-eyebrow","label":"Small label above the headline","help":"Two or three words in capitals that name this section, such as the words you'd use on a signpost. It sits above the big headline next to a small number.","kind":"eyebrow","max":24,"req":true,"legal":false,"token":"","ph":"1 to 3 words, no full stop"},{"id":"hero-title-line-1","label":"Headline, first line","help":"The first line of the very large headline. One or two words only, and no full stop on this line — the sentence finishes on the second line. Think of it as the start of a short phrase, not a slogan.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation at the end"},{"id":"hero-title-line-2","label":"Headline, second line (coloured)","help":"The second line of the headline. This one prints in the terracotta accent colour and must end with a full stop. One or two words. Together both lines should read as a single short phrase of no more than three words.","kind":"display-accent","max":20,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"hero-lede","label":"Opening paragraph","help":"One warm, plain paragraph of roughly 25 to 45 words telling a newcomer what they can actually do here — help at events, join as a member, or both. Write it as if you were speaking to one person who has just walked in the door. No jargon, no slogans.","kind":"lede","max":300,"req":true,"legal":false,"token":"","ph":"one paragraph, 25 to 45 words"},{"id":"hero-primary-cta-label","label":"Main button text","help":"The words on the main button, in capitals when displayed. Two to four words, starting with a verb, describing the single most useful next step (usually going to the volunteer form).","kind":"cta-label","max":28,"req":true,"legal":false,"token":"","ph":"2 to 4 words beginning with a verb"},{"id":"hero-secondary-cta-label","label":"Second button text (optional)","help":"Optional quieter second button, usually pointing at membership. Two to four words. Leave blank if one button is enough.","kind":"cta-label","max":28,"req":false,"legal":false,"token":"","ph":"2 to 4 words beginning with a verb"}],"repeat":null,"ink":false},{"id":"volunteer","number":"02","eyebrow":"Volunteering","purpose":"","layout":"split","fields":[{"id":"volunteer-eyebrow","label":"Small label above the headline","hel rea of the organisation it belongs to. It appears as a tiny label at the top of the card.","kind":"eyebrow","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words"},{"id":"role-name","label":"Role name","help":"What you'd call this role out loud, in two to four words. Plain and concrete — name the job, not a title. This is also the wording people will pick from in the form's dropdown.","kind":"short","max":60,"req":true,"legal":false,"token":"","ph":"2 to 4 words"},{"id":"role-description","label":"What the role involves","help":"About 40 to 70 words. Describe a typical shift in plain language: what the person does, who they work with, and where. Avoid promises you can't keep and avoid participant or attendance numbers — those come from your records.","kind":"body","max":550,"req":true,"legal":false,"token":"","ph":"one paragraph, 40 to 70 words"},{"id":"role-commitment","label":"Time commitment","help":"A short phrase showing at the bottom of the card telling people how much time this takes and how often. Keep it under about eight words and be realistic — people drop out when the real commitment turns out to be bigger than advertised.","kind":"short","max":70,"req":true,"legal":false,"token":"","ph":"a short phrase naming an amount of time and how often"},{"id":"role-requirement","label":"Anything needed before starting (optional)","help":"Only fill this in if there is a genuine requirement your board has agreed to, such as a background check, a minimum age, or a language. One short sentence. Leave blank if there is nothing — do not invent a requirement to make the role sound serious.","kind":"short","max":120,"req":false,"legal":false,"token":"","ph":"one short sentence, or blank"}],"repeat":{"noun":"role","min":0,"suggested":4,"max":10},"ink":false},{"id":"membership","number":"03","eyebrow":"Membership","purpose":"","layout":"split","fields":[{"id":"membership-eyebrow","label":"Small label above the headline","help":"Two or three words in capitals naming this section.","kind":"eyebrow","max":24,"req":true,"legal":false,"token":"","ph":"1 to 3 words, no full stop"},{"id":"membership-title-line-1","label":"Headline, first line","help":"First line of the large section headline. One or two words, no full stop — it continues on the coloured line below.","kind":"display-title","max":24,"req":true,"legal":false,"token":"","ph":"1 to 2 words, no punctuation at the end"},{"id":"membership-title-line-2","label":"Headline, second line (coloured)","help":"Second line of the headline, in the accent colour, ending with a full stop. One or two words.","kind":"display-accent","max":20,"req":true,"legal":false,"token":"","ph":"1 to 2 words ending in a full stop"},{"id":"membership-lede","label":"Short introduction","help":"Roughly 25 to 45 words on what membership actually is and why someone would take it up. Say plainly whether it is mainly about supporting the foundation, about taking part in decisions, or both.","kind":"lede","max":300,"req":true,"legal":false,"token":"","ph":"one paragraph, 25 to 45 words"},{"id":"membership-body","label":"What membership includes","help":"Roughly 40 to 90 words describing how membership works in practice — how long it lasts, how it renews, and what members are entitled to do. Only state rights (such as voting at a general meeting) that your constitution or bylaws actually grant. If you are unsure, leave that part out and tell us.","kind":"body","max":650,"req":true,"legal":false,"token":"","ph":"one or two paragraphs, 40 to 90 words total"},{"id":"membership-eligibility","label":"Who can join (optional)","help":"One short paragraph of about 25 to 50 words on who is eligible — any age limit, whether you must live in the London area, whether you need to be of Turkish background. Write only what your bylaws say. Leave blank if membership is open to anyone.","kind":"longtext","max":400,"req":false,"legal":false,"token":"","ph":"one paragraph, 25 to 50 words, or blank"},{"id":"membership-receipt-note","label":"Small print: are membership fees receiptable?","help":"LEAVE THIS BLANK until your board or accountant confirms it in writing. It is the one line on this page that says whether a membership fee gets a tax receipt. We will not write a guess for you, and the page will simply not show this line until the confirmed wording arrives.","kind":"longtext","max":300,"req":false,"legal":true,"token":"{{DONATION_TAX_RECEIPTABLE}}","ph":""}],"repeat":null,"ink":false},{"id":"tiers","number":"","eyebrow":"","purpose":"Membership levels and what each costs.","layout":"cards","fields":[{"id":"tier-name","label":"Membership level name","help":"What this level is called, in one to three words. Use the names already written in your bylaws or on your paper form so the website and your records match.","kind":"short","max":50,"req":true,"legal":false,"token":"","ph":"1 to 3 words"},{"id":"tier-fee-amount","label":"Fee amount","help":"The fee as a figure with the dollar sign, exactly as approved by the board — do not round it or estimate it. It prints large on the card. If a level is free, write the word for free instead of a figure.","kind":"stat-value","max":16,"req":true,"legal":false,"token":"","ph":"a dollar figure, or a single word if there is no fee"},{"id":"tier-fee-period","label":"How often the fee is paid","help":"The tiny label printed under the amount saying what period it covers, such as whether it is charged yearly or once. Two or three words.","kind":"stat-label","max":24,"req":true,"legal":false,"token":"","ph":"2 to 3 words"},{"id":"tier-description","label":"Who this level is for","help":"About 30 to 60 words describing the kind of person or household this level suits. Plain and friendly.","kind":"body","max":450,"req":true,"legal":false,"token":"","ph":"one paragraph, 30 to 60 words"},{"id":"tier-benefits","label":"What this level includes","help":"Three to five short lines, one benefit per line, each under about ten words. They print as a bulleted list.
